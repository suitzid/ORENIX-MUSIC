/* кэш обложек на устройстве (Cache API) */
async function hydrate(){
  document.querySelectorAll('img[data-cov]').forEach(async im=>{
    const u=im.dataset.cov; delete im.dataset.cov;
    try{const c=await caches.open('orenix-covers-v1');let r=await c.match(u);
      if(!r){await c.add(new Request(u,{mode:'cors'}));r=await c.match(u)}
      im.onload=()=>URL.revokeObjectURL(im.src);im.src=URL.createObjectURL(await r.blob())}
    catch(e){im.src=u}});
}

/* ---------- файлы: ID3, обложки ---------- */
async function id3(f){ /* название, исполнитель и картинка из mp3 */
  try{
    const h=new Uint8Array(await f.slice(0,10).arrayBuffer());
    if(String.fromCharCode(...h.slice(0,3))!=='ID3') return {};
    const ss=a=>(a[0]<<21)|(a[1]<<14)|(a[2]<<7)|a[3], v=h[3];
    const b=new Uint8Array(await f.slice(10,10+ss(h.slice(6,10))).arrayBuffer()), o={};
    const dec=(a,e)=>new TextDecoder(e===1?'utf-16':e===3?'utf-8':'windows-1251').decode(a).replace(/\0/g,'');
    let p=0;
    while(p+10<=b.length){
      const id=String.fromCharCode(...b.slice(p,p+4)); if(!/^[A-Z0-9]{4}$/.test(id)) break;
      const sz=v===4?ss(b.slice(p+4,p+8)):new DataView(b.buffer,p+4,4).getUint32(0);
      const d=b.slice(p+10,p+10+sz); p+=10+sz;
      if(id==='TIT2') o.title=dec(d.slice(1),d[0]);
      else if(id==='TPE1') o.artist=dec(d.slice(1),d[0]);
      else if(id==='APIC'){
        let i=1; while(d[i]) i++; const mime=dec(d.slice(1,i),0); i+=2;
        if(d[0]===1||d[0]===2){while(d[i]||d[i+1]) i+=2; i+=2} else {while(d[i]) i++; i++}
        o.pic=new Blob([d.slice(i)],{type:mime||'image/jpeg'});
      }
    }
    return o;
  }catch(e){return {}}
}
async function shrink(blob,max=600){
  try{const bm=await createImageBitmap(blob),k=Math.min(1,max/Math.max(bm.width,bm.height));
    const c=document.createElement('canvas');c.width=bm.width*k;c.height=bm.height*k;c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',.85))}catch(e){return blob}
}
async function putCover(blob,prefix=''){
  const path=session.user.id+'/'+prefix+crypto.randomUUID()+'.jpg';
  const r=await sb.storage.from('covers').upload(path,await shrink(blob,prefix?400:600),{contentType:'image/jpeg'});
  if(r.error) throw r.error;
  return sb.storage.from('covers').getPublicUrl(path).data.publicUrl;
}

    const r=on?await sb.from('playlist_likes').delete().match({user_id:session.user.id,playlist_id:id}):await sb.from('playlist_likes').upsert({user_id:session.user.id,playlist_id:id});
    if(r.error) return toast('Ошибка: '+r.error.message); on?likedPl.delete(id):likedPl.add(id); return x.classList.toggle('on',!on)}
  if(x=g('[data-playall]')){const [l,id]=x.dataset.playall.split('.');if(R[l].length){queue=R[l].slice();play(0);sb.rpc('inc_playlist_plays',{pid:id})}return}
  if(x=g('[data-l]')){queue=R[x.dataset.l].slice();return play(+x.dataset.i)}
  if(x=g('[data-pl]')) return openPlaylist(x.dataset.pl);
  if(x=g('[data-user]')) return showProfile(x.dataset.user);
});
document.querySelector('.nav-island').onclick=e=>{const b=e.target.closest('[data-nav]'); if(b) nav(b.dataset.nav)};

/* ---------- вход ---------- */
async function signIn(){await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}})}
async function loadMe(){
  isAdmin=false; liked=new Set(); likedPl=new Set(); followed=new Set(); if(!session) return;
  const u=session.user.id;
  const [me,lk,lp,fl]=await Promise.all([sb.from('profiles').select('is_admin').eq('id',u).single(),sb.from('likes').select('track_id').eq('user_id',u),sb.from('playlist_likes').select('playlist_id').eq('user_id',u),sb.from('follows').select('following_id').eq('follower_id',u)]);
  isAdmin=!!(me.data&&me.data.is_admin);
  (lk.data||[]).forEach(x=>liked.add(x.track_id)); (lp.data||[]).forEach(x=>likedPl.add(x.playlist_id)); (fl.data||[]).forEach(x=>followed.add(x.following_id));
}
(async()=>{
  const {data}=await sb.auth.getSession(); session=data.session;
  sb.auth.onAuthStateChange((_e,s)=>{session=s});
  await loadMe(); nav('home');
  /* новые загрузки обновляются сразу после появления трека */
  sb.channel('new-tracks').on('postgres_changes',{event:'INSERT',schema:'public',table:'tracks'},()=>{if(curNav==='home'&&document.querySelector('#app .scroll'))nav('home')}).subscribe();
})();
</script>
