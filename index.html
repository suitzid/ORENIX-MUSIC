<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1512">
<title>Orenix Music v0.4.8</title>
<style>
/* Orenix Music v0.4.0 — стили (палитра и навбар из референса) */
:root{
  --bg-app:#0d1512; --bg-screen:#16211f; --bg-field:#1f2c29; --bg-card:#1f2c29; --border-hair:#263230;
  --text-primary:#f2f4ef; --text-secondary:#8b968f; --text-tertiary:#6d7873;
  --accent:#4fd6b4; --accent-fill:#2eb896; --accent-dark:#0d1f1a; --blue:#4a7cf0; --danger:#e2716a;
  --glass-bg:rgba(255,255,255,.06); --glass-border:rgba(255,255,255,.12);
  --glass-active-bg:rgba(46,184,150,.25); --glass-active-border:rgba(79,214,180,.35);
  --ios-glass:rgba(28,40,37,.66); --ios-spring:cubic-bezier(.32,1.38,.5,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{margin:0;background:var(--bg-app);color:var(--text-primary);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg.icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
small{color:var(--text-secondary)}
#app{min-height:100vh;background:var(--bg-screen);padding-bottom:210px}

/* верхняя плашка с логотипом */
#tb{position:fixed;top:0;left:0;right:0;z-index:43;pointer-events:none;height:calc(env(safe-area-inset-top,0px) + 48px);
  background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,0));-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);
  -webkit-mask-image:linear-gradient(180deg,#000 55%,transparent);mask-image:linear-gradient(180deg,#000 55%,transparent)}
#gi{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);z-index:44;pointer-events:none;text-align:center}
#gi img{display:block;height:25px;border-radius:999px;box-shadow:0 8px 22px rgba(0,0,0,.42),0 0 0 .5px rgba(255,255,255,.18)}
#gi span{display:block;margin-top:3px;font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--text-secondary)}

/* шапка экрана: настройки слева, колокольчик/плюс справа */
.hd{display:flex;justify-content:space-between;align-items:center;height:calc(env(safe-area-inset-top,0px) + 60px);padding:env(safe-area-inset-top,0px) 16px 0;position:relative;z-index:45}
.ib{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;background:var(--glass-bg);border:.5px solid var(--glass-border);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.ib:active,.btn:active{background:var(--glass-active-bg);border-color:var(--glass-active-border)}
.pad{padding:0 16px}

/* секции и горизонтальные карусели */
.sec{margin-top:18px}
.sh{display:flex;justify-content:space-between;align-items:center;padding:0 16px 10px}
.sh h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
.hs{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;scroll-snap-type:x proximity;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.card{flex:none;width:128px;position:relative;scroll-snap-align:start;cursor:pointer}
.card b{display:block;margin-top:6px;font-size:14px}
.card b,.card small,.row .t b,.row .t small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{display:block;font-size:12px}
.cov{display:block;width:128px;height:128px;border-radius:18px;object-fit:cover;background:linear-gradient(135deg,var(--blue),var(--accent));border:.5px solid var(--glass-border)}
.act{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:var(--accent);background:var(--ios-glass);border:.5px solid var(--glass-border)}
.act.del{right:auto;left:6px;color:var(--danger)}
.empty{padding:6px 16px;color:var(--text-tertiary)}

/* строки списков */
.row{display:flex;align-items:center;gap:12px;padding:8px;margin:8px 0;border-radius:16px;background:var(--bg-card);border:.5px solid var(--border-hair);cursor:pointer}
.row .cov,.row .av{width:48px;height:48px;border-radius:12px;flex:none}
.row .t{flex:1;min-width:0}.row .t b,.row .t small{display:block}
.row .ib{width:32px;height:32px;color:var(--accent)}

/* экраны-оверлеи, шторки, поля, кнопки */
.ov{position:fixed;inset:0;z-index:60;background:var(--bg-screen);overflow:auto;padding:0 16px 210px}
.ovh{display:flex;align-items:center;gap:12px;height:calc(env(safe-area-inset-top,0px) + 60px);padding-top:env(safe-area-inset-top,0px);position:sticky;top:0;z-index:2}
.ovh h2{flex:1;margin:0;font-size:20px;text-align:center}
.shade{position:fixed;inset:0;z-index:69;background:rgba(0,0,0,.5)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;max-height:88vh;overflow:auto;background:var(--bg-screen);border-radius:26px 26px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));border-top:.5px solid var(--glass-border)}
.sheet h2{margin:0 0 12px;font-size:20px}
.in{display:block;width:100%;padding:12px 14px;margin:8px 0;font:inherit;color:var(--text-primary);background:var(--bg-field);border:.5px solid var(--border-hair);border-radius:14px;outline:0}
.in::placeholder{color:var(--text-tertiary)}.in:focus{border-color:var(--glass-active-border)}
.btn{display:block;width:100%;padding:13px 18px;margin:8px 0;border-radius:999px;font-weight:600;text-align:center;background:var(--glass-bg);border:.5px solid var(--glass-border);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.btn.pri{background:var(--accent-fill);color:var(--accent-dark);border-color:transparent}
.btn.dng{color:var(--danger)}.btn:disabled{opacity:.5}
.upl{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.pg{flex:1;min-width:0}.pg span{display:block;font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg i{display:block;height:3px;margin-top:6px;border-radius:2px;background:var(--border-hair);overflow:hidden}
.pg.busy i::after{content:"";display:block;width:35%;height:100%;background:var(--accent);animation:pgm 1s linear infinite}
@keyframes pgm{from{margin-left:-35%}to{margin-left:100%}}
.cpick{display:flex;align-items:center;gap:12px}.cpick .cov{width:72px;height:72px;border-radius:14px}.cpick .btn{width:auto;margin:0}
.pick.sel{background:var(--glass-active-bg);border-color:var(--glass-active-border)}

/* профиль */
.av{display:grid;place-items:center;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--blue),var(--accent));font-weight:700;color:#fff}
.pf{text-align:center;padding:0 16px}.pf .av{margin:0 auto 10px}
.pf h1{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:24px}
.vf{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent-fill);color:var(--accent-dark);font-size:11px}
.cnt{display:flex;justify-content:center;gap:28px;margin:12px 0}.cnt b{display:block;font-size:18px}.cnt small{font-size:12px}
.chip{display:inline-block;padding:6px 14px;border-radius:999px;font-size:13px;color:var(--accent);background:var(--glass-active-bg);border:.5px solid var(--glass-active-border)}
.srow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:.5px solid var(--border-hair)}

/* мини-плеер и тост */
#mp{position:fixed;left:12px;right:12px;bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:49;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:26px;background:var(--ios-glass);-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);border:.5px solid rgba(255,255,255,.15);box-shadow:0 12px 32px rgba(0,0,0,.4)}
#mp[hidden]{display:none}
#mp .cov{width:42px;height:42px;border-radius:10px;flex:none}
#mp .t{flex:1;min-width:0}#mp .t b,#mp .t small{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sk{width:100%;margin:2px 0 0;accent-color:var(--accent);height:14px}
#mp .ib{width:34px;height:34px;font-size:12px}#pp{background:var(--accent-fill);color:var(--accent-dark);border-color:transparent}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);left:50%;transform:translate(-50%,-10px);z-index:99;padding:9px 16px;border-radius:999px;background:var(--ios-glass);border:.5px solid var(--glass-border);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-size:14px;opacity:0;pointer-events:none;transition:.25s}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* нижний навбар (как в референсе) */
.nav{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;z-index:50;--nw:min(62px,calc((100vw - 36px) / 4))}
.nav-island{position:relative;display:flex;padding:6px;border-radius:38px;background:var(--ios-glass);-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);border:.5px solid rgba(255,255,255,.15);box-shadow:0 16px 42px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.12)}
.nav-ind{position:absolute;top:6px;left:6px;width:var(--nw);height:58px;border-radius:30px;background:rgba(130,138,134,.20);border:.5px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);transform:translateX(calc(var(--i,0) * var(--nw)));transition:transform .6s cubic-bezier(.3,1.2,.4,1)}
.nav-btn{position:relative;z-index:1;width:var(--nw);height:58px;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .15s}
.nav-btn svg{color:#aab3ad;width:23px;height:23px;transition:color .3s,transform .45s var(--ios-spring)}
.nav-btn::after{content:attr(aria-label);font-size:10px;font-weight:600;line-height:1;color:#9aa5a0;transition:color .3s}
.nav-btn.active svg,.nav-btn.active::after{color:var(--accent)}
.nav-btn.active svg{transform:scale(1.1)}.nav-btn:active{transform:scale(.92)}

/* v0.4.1: треки колонками по 3, как в референсе */
.tc{display:grid;grid-template-rows:repeat(3,auto);grid-auto-flow:column;grid-auto-columns:calc(100vw - 64px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 4px;scrollbar-width:none}
.tc::-webkit-scrollbar{display:none}
.tc .tr{scroll-snap-align:start}
.tr{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer}
.tr:active{opacity:.7}
.tr .cov{width:56px;height:56px;border-radius:14px;flex:none}
.tr .t{flex:1;min-width:0}
.tr .t b,.tr .t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .t b{font-size:16px;font-weight:600}.tr .t small{font-size:14px}
.tr .du{font-size:14px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.tr .rk{width:22px;text-align:center;font-weight:600;color:var(--text-secondary)}
.tr .x{color:var(--danger);font-size:14px;padding:6px}
.ov .tr{padding:8px 0}
/* мини-плеер: линия прогресса сверху, ♥, пауза, дальше */
#pb{position:absolute;top:0;left:20px;right:20px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;cursor:pointer}
#pb i{display:block;height:100%;width:0;background:var(--accent)}
#mp{padding-top:12px}#lk{color:var(--accent)}

/* ===== v0.4.2 ===== */
.ht{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em}
.shb{display:flex;gap:8px}
/* навбар без подписей, профиль = аватар */
.nav-btn::after{display:none}
.nav-btn,.nav-ind{height:54px}
.nav-btn .av{transition:box-shadow .3s}
.nav-btn.active .av{box-shadow:0 0 0 2px var(--accent)}
/* строка трека: меню-троеточие */
.tr{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.tr .x{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;flex:none;padding:0;color:var(--text-secondary);font-size:inherit}
.tr .x:active{background:var(--glass-active-bg);color:var(--accent)}
.tr .x svg{width:20px;height:20px}
/* меню трека (стекло) */
.sheet.glass{background:rgba(22,33,31,.8);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border-top:.5px solid rgba(255,255,255,.18);box-shadow:0 -12px 40px rgba(0,0,0,.45)}
.mhead{display:flex;align-items:center;gap:14px;padding-bottom:14px;margin-bottom:4px;border-bottom:.5px solid var(--glass-border)}
.mhead .cov{width:68px;height:68px;border-radius:16px;flex:none}
.mhead .t{min-width:0}.mhead b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhead small{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:14px 6px;font-size:16px;text-align:left;border-bottom:.5px solid var(--border-hair);border-radius:12px}
.mi:last-child{border-bottom:0}.mi svg{color:var(--accent)}
.mi:active{background:var(--glass-active-bg)}
.mi.dng,.mi.dng svg{color:var(--danger)}
/* таблетка плеера: фиксированный размер */
#mp{left:50%;right:auto;transform:translateX(-50%);width:min(calc(100vw - 24px),420px);height:64px;padding:8px 10px 8px 8px;gap:10px;border-radius:32px;bottom:calc(98px + env(safe-area-inset-bottom,0px))}
#mp .cov{width:48px;height:48px;border-radius:14px;flex:none}
#mp .t b{font-size:15px;font-weight:600;line-height:1.25}#mp .t small{font-size:13px;line-height:1.25}
.pb2{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--text-primary);background:var(--glass-bg);border:.5px solid var(--glass-border);transition:transform .15s,background .2s}
.pb2:active{transform:scale(.9)}
.pb2 svg{width:21px;height:21px}
.pb2.main{background:var(--accent-fill);border-color:transparent;color:var(--accent-dark)}
.icon.f{fill:currentColor;stroke:currentColor;stroke-width:1.4}
#lk.on{background:var(--glass-active-bg);border-color:var(--glass-active-border);color:var(--accent)}
#lk.on svg{fill:var(--accent)}
/* прогресс загрузки */
.bar{height:6px;margin-top:8px;border-radius:3px;background:var(--border-hair);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--accent-fill),var(--accent));transition:width .15s}
.pg.busy i::after{content:none}
.err{margin:2px 0 6px;font-size:13px;color:var(--danger)}.err:empty{display:none}
.bar i,.pg .bar i{margin:0;height:100%;background:linear-gradient(90deg,var(--accent-fill),var(--accent))}

/* ===== v0.4.3 ===== */
/* навбар поменьше, индикатор круглый */
.nav{--nw:48px;--ng:4px}
.nav-island{gap:var(--ng);padding:5px;border-radius:34px}
.nav-btn{width:var(--nw);height:var(--nw);border-radius:50%}
.nav-ind{top:5px;left:5px;width:var(--nw);height:var(--nw);border-radius:50%;transform:translateX(calc(var(--i,0) * (var(--nw) + var(--ng))))}
.nav-btn svg{width:22px;height:22px}
/* таблетка: винил, заливка прогресса, свайп */
#mp{bottom:calc(88px + env(safe-area-inset-bottom,0px));height:66px;overflow:hidden;touch-action:pan-y;padding:7px 10px 7px 7px}
#mp::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(90deg,rgba(150,235,210,.20) var(--pg,0%),rgba(150,235,210,0) var(--pg,0%))}
#mp>*{position:relative;z-index:1}
.vinyl{position:relative;width:52px;height:52px;flex:none;border-radius:50%;
  background:conic-gradient(from 20deg,#0f1413,#1c2523 12%,#0f1413 25%,#1c2523 38%,#0f1413 50%,#1c2523 62%,#0f1413 75%,#1c2523 88%,#0f1413);
  box-shadow:0 4px 14px rgba(0,0,0,.45),inset 0 0 0 .5px rgba(255,255,255,.18)}
.vinyl::before{content:"";position:absolute;inset:3px;border-radius:50%;background:repeating-radial-gradient(circle,rgba(255,255,255,0) 0 1.6px,rgba(255,255,255,.07) 1.6px 2.2px)}
.vinyl::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--bg-app);box-shadow:0 0 0 1px rgba(255,255,255,.22);z-index:3}
#mp #mpc{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:0;z-index:2}
.vinyl.spin{animation:vspin 5s linear infinite}
@keyframes vspin{to{transform:rotate(360deg)}}
#mp.mswl>.t{animation:swl .28s ease}#mp.mswr>.t{animation:swr .28s ease}
@keyframes swl{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes swr{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
/* профиль */
.pcard{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;margin:4px 16px 0;padding:16px;border-radius:26px;background:var(--bg-card);border:.5px solid var(--border-hair)}
.pcard::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 0% 0%,rgba(79,214,180,.14),transparent 60%)}
.pcard>*{position:relative}
.pcard .av{width:92px;height:92px;flex:none;box-shadow:0 0 0 3px var(--bg-card),0 0 0 4.5px var(--glass-active-border)}
.pc-main{flex:1;min-width:0}
.pc-name{display:flex;align-items:center;gap:6px}
.pc-name h1{margin:0;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-cnt{display:flex;align-items:center;gap:12px;margin:8px 0 8px}
.pc-cnt b{display:block;font-size:18px;line-height:1.1}.pc-cnt small{font-size:12px}
.pc-cnt i{width:1px;height:26px;background:var(--border-hair)}
.pc-ban{flex:none;align-self:stretch;min-width:44px;display:grid;place-items:center;border-radius:18px;border:1px dashed var(--glass-border);background:var(--glass-bg);color:var(--text-tertiary);font-size:22px}
.mrow{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;margin:8px 0;border-radius:20px;font-size:16px;text-align:left;background:var(--bg-card);border:.5px solid var(--border-hair)}
.mrow:active{background:var(--glass-active-bg);border-color:var(--glass-active-border)}
.mrow>span:nth-child(2){flex:1;min-width:0}
.mrow>svg:last-child{width:18px;height:18px;color:var(--text-tertiary)}
.mi-ic{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;overflow:hidden;flex:none;color:var(--accent);background:var(--glass-active-bg);border:.5px solid var(--glass-active-border)}
.mi-ic .av{width:36px!important;height:36px!important;border-radius:12px}
.mrow.dng{color:var(--danger)}.mrow.dng .mi-ic{color:var(--danger);background:rgba(226,113,106,.14);border-color:rgba(226,113,106,.35)}
.tag{font-size:12px;color:var(--text-tertiary);padding:3px 10px;border-radius:999px;background:var(--glass-bg);border:.5px solid var(--glass-border)}
.ft{text-align:center;padding:26px 0 8px;font-size:13px;color:var(--text-tertiary)}.ft a{color:var(--accent);text-decoration:none}
/* статистика */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 14px}
.tile{padding:14px 6px;text-align:center;border-radius:18px;background:var(--bg-card);border:.5px solid var(--border-hair)}
.tile b{display:block;font-size:24px;line-height:1.1;color:var(--accent)}.tile small{font-size:12px}
.sh3{margin:6px 0;font-size:14px;font-weight:600;color:var(--text-secondary)}
.awr{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}.chip.off{opacity:.35}

/* ===== v0.4.4: колокольчик и уведомления ===== */
.ib{position:relative}
.hr{display:flex;gap:8px}
.bd{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center;border-radius:9px;font-size:10px;font-weight:700;font-style:normal;color:#fff;background:var(--danger);border:1.5px solid var(--bg-screen)}
.nr.new{background:var(--glass-active-bg);border-color:var(--glass-active-border)}
.nr .t small{white-space:normal}
.nr .av{border-radius:50%!important}

/* ===== v0.4.6 ===== */
/* док: плеер и навбар в одном блоке, контент не перекрывается */
#dock{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:65;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#dock>*{pointer-events:auto}
#dock .nav{position:static;left:auto;right:auto;bottom:auto}
#dock #mp{position:relative;left:auto;right:auto;bottom:auto;transform:none}
#app,.ov{padding-bottom:calc(var(--dock-h,100px) + 28px)}
/* лёгкий градиент на фоне страниц */
#app,.ov{background:linear-gradient(180deg,rgba(79,214,180,.09),rgba(79,214,180,0) 340px),radial-gradient(90% 45% at 100% 0%,rgba(74,124,240,.08),transparent),var(--bg-screen)}
/* медали топ-3 */
.tr .rk{width:28px;display:grid;place-items:center}
.md{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:800;color:#2b2200;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 6px rgba(0,0,0,.35)}
.g1{background:linear-gradient(145deg,#ffe27a,#d99a1c)}.g2{background:linear-gradient(145deg,#f4f6f8,#a3acb4)}.g3{background:linear-gradient(145deg,#f3b985,#b4682c)}
/* бейджи */
.bchip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--bc);background:color-mix(in srgb,var(--bc) 16%,transparent);border:.5px solid color-mix(in srgb,var(--bc) 40%,transparent)}
.bsym{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;flex:none;font-size:20px;color:var(--bc);background:color-mix(in srgb,var(--bc) 16%,transparent);border:.5px solid color-mix(in srgb,var(--bc) 40%,transparent)}
.bsym.off{filter:grayscale(1);opacity:.4}
/* профиль с кастомным цветом */
.pcard::before{background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--pa,#4fd6b4) 24%,transparent),transparent 60%)}
.pcard .av{box-shadow:0 0 0 3px var(--bg-card),0 0 0 5px var(--pa,var(--glass-active-border))}
.pcard.nofr .av{box-shadow:none}
.pc-bio{font-size:13px;color:var(--text-secondary);margin:2px 0}
.pc-name{flex-wrap:wrap}
.pal{display:flex;gap:10px;margin:8px 0 14px}
.swt{width:34px;height:34px;border-radius:50%;background:var(--c);border:2px solid transparent;box-shadow:0 0 0 1px var(--glass-border)}
.swt.on{border-color:var(--text-primary)}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px;border-radius:14px;background:var(--glass-bg);border:.5px solid var(--glass-border)}
.seg button.on{background:var(--glass-active-bg);border-color:var(--glass-active-border);color:var(--accent)}
textarea.in{resize:none}
/* переключатели настроек */
.swr{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:.5px solid var(--border-hair)}
.swr>div{flex:1;min-width:0}
.sw{position:relative;width:50px;height:30px;flex:none;border-radius:15px;background:var(--glass-bg);border:.5px solid var(--glass-border);transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .25s}
.sw.on{background:var(--accent-fill);border-color:transparent}.sw.on::after{left:22px}
/* поиск: история и популярное */
.sr{display:flex;justify-content:space-between;align-items:center}
.lnk{font-size:13px;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip2{display:inline-flex;align-items:center;border-radius:999px;background:var(--glass-bg);border:.5px solid var(--glass-border);overflow:hidden}
.chip2 button{padding:8px 12px;font-size:14px}
.chip2 button+button{padding-left:0;color:var(--text-tertiary)}
button.chip2{padding:8px 14px;font-size:14px}
.chip2.pop i{font-style:normal;color:var(--accent);font-weight:700;margin-right:6px}

/* ===== v0.4.7 ===== */
#gi span{display:none}
/* док выше: в полноэкранном режиме не залезает на системную панель */
#dock{bottom:calc(env(safe-area-inset-bottom,0px) + 46px)}
#app,.ov{padding-bottom:calc(var(--dock-h,100px) + 66px + env(safe-area-inset-bottom,0px))}
/* треки: отступ от края экрана и при снапе */
.tc{column-gap:16px;row-gap:14px;scroll-padding-left:16px;scroll-padding-right:16px}
.hs{scroll-padding-left:16px;scroll-padding-right:16px}
/* медальки */
.tr .rk{width:30px}
.md{display:inline-block;width:24px;height:30px;border-radius:0;background:none;box-shadow:none;line-height:0}
.md svg{width:24px;height:30px;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.pc-name .md{width:20px;height:25px}.pc-name .md svg{width:20px;height:25px}
/* бейджи-картинки */
.pc-ban{width:64px;min-width:64px;padding:0;overflow:hidden}
.pc-ban.has{border:.5px solid var(--glass-border)}
.pc-ban .bimg{width:100%;height:100%;object-fit:cover;display:block}
.pc-ban svg{width:26px;height:26px}
.bsym{overflow:hidden}.bsym img.bi{width:100%;height:100%;object-fit:cover;display:block}
.bchi{width:18px;height:18px;border-radius:6px;object-fit:cover}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.bpk{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:16px;background:var(--glass-bg);border:.5px solid var(--glass-border)}
.bpk.on{border-color:var(--accent);background:var(--glass-active-bg)}
.bpk .bsym{width:64px;height:64px;border-radius:16px}
.bpk small{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* кнопки входа с иконками */
.btn-ic{display:flex;align-items:center;justify-content:center;gap:10px}
.gic{width:22px;height:22px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}.gic svg{width:14px;height:14px}
.oxi{width:22px;height:20px;object-fit:contain;flex:none}
.mi-ic .oxi{width:22px;height:20px}
/* верхние кнопки ниже */
:root{--tl:36px}
.hd{height:calc(env(safe-area-inset-top,0px) + 60px + var(--tl));padding-top:calc(env(safe-area-inset-top,0px) + var(--tl))}
.ovh{height:calc(env(safe-area-inset-top,0px) + 60px + var(--tl));padding-top:calc(env(safe-area-inset-top,0px) + var(--tl))}
#gi{top:calc(env(safe-area-inset-top,0px) + 10px + var(--tl))}
#tb{height:calc(env(safe-area-inset-top,0px) + 48px + var(--tl))}
#toast{top:calc(env(safe-area-inset-top,0px) + 64px + var(--tl))}
/* ===== v0.4.8: отображение бейджа ===== */
.pcard>.pc-fade{position:absolute;top:0;right:0;bottom:0;width:60%;z-index:0;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,rgba(0,0,0,.55) 38%,#000 78%),linear-gradient(180deg,transparent,#000 22%,#000 78%,transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent,rgba(0,0,0,.55) 38%,#000 78%),linear-gradient(180deg,transparent,#000 22%,#000 78%,transparent);mask-composite:intersect}
.pc-fade img{width:100%;height:100%;object-fit:cover;display:block;opacity:.9}
.pcard>.av,.pcard>.pc-main{z-index:1}
.pcard.hasfade .pc-main{text-shadow:0 1px 8px rgba(0,0,0,.65)}
.pcard.ed>*:not(.pc-fade):not(.pc-ban){pointer-events:none}
/* кадрирование картинки бейджа */
.crf{position:relative;overflow:hidden;margin:0 auto;border-radius:18px;background:#000;border:.5px solid var(--glass-border);touch-action:none}
.crf img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;user-select:none;-webkit-user-drag:none;pointer-events:none}
</style>
</head>

<script>
/* страж запуска: работает даже если основной скрипт упал */
(function(){
  function show(m){var e=document.getElementById('app');if(!e||e.dataset.ok)return;
    e.innerHTML='<div style="padding:110px 20px 0"><p style="color:#8b968f;margin:0 0 14px">'+m+'</p><button class="btn pri" onclick="location.reload()">Перезагрузить</button><button class="btn" onclick="orxReset()">Сбросить вход и перезапустить</button></div>'}
  window.orxReset=function(){try{Object.keys(localStorage).filter(function(k){return /^sb-|supabase/.test(k)}).forEach(function(k){localStorage.removeItem(k)})}catch(e){}
    try{indexedDB.deleteDatabase('orx')}catch(e){}location.replace(location.href.split(/[?#]/)[0])};
  function why(){return window.supabase?'Приложение не загрузилось.':'Приложение не запустилось. Проверь интернет.'}
  window.addEventListener('error',function(e){show(why()+'<br><small>'+(e.message||'')+'</small>')});
  window.orxShow=show;
  setTimeout(function(){show(why())},30000);
})();
</script>

<script>
/* Мини-клиент Supabase без CDN: auth (implicit/refresh), PostgREST, storage. Те же вызовы, что у supabase-js. */
(function(){
const enc=encodeURIComponent,now=()=>Math.floor(Date.now()/1000);
function createClient(url,key,opts){
  const ref=(url.match(/\/\/([^.]+)\./)||[])[1]||'x',SK='sb-'+ref+'-auth-token';
  const st=(opts&&opts.auth&&opts.auth.storage)||{getItem:async k=>localStorage.getItem(k),setItem:async(k,v)=>localStorage.setItem(k,v),removeItem:async k=>localStorage.removeItem(k)};
  let sess=null,initP=null,refP=null;const subs=[];
  const emit=(ev,s)=>subs.forEach(f=>{try{f(ev,s)}catch(e){}});
  const save=async s=>{sess=s;try{await st.setItem(SK,JSON.stringify(s))}catch(e){}};
  const drop=async()=>{sess=null;try{await st.removeItem(SK)}catch(e){}};
  const norm=j=>({access_token:j.access_token,refresh_token:j.refresh_token,token_type:j.token_type||'bearer',expires_in:j.expires_in,expires_at:j.expires_at||now()+(+j.expires_in||3600),user:j.user});
  async function refresh(rt){
    const r=await fetch(url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});
    const j=await r.json();if(!r.ok||!j.access_token){const e=new Error(j.msg||j.error_description||'refresh failed');e.bad=r.status>=400&&r.status<500;throw e}
    return norm(j)}
  async function fromHash(){
    if(!/access_token=/.test(location.hash))return null;
    const p=new URLSearchParams(location.hash.replace(/^#/,'')),at=p.get('access_token');
    try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
    if(!at)return null;
    let u=null;
    try{const r=await fetch(url+'/auth/v1/user',{headers:{apikey:key,Authorization:'Bearer '+at}});if(r.ok)u=await r.json()}catch(e){}
    if(!u||!u.id){try{const pl=JSON.parse(decodeURIComponent(escape(atob(at.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))));
      u={id:pl.sub,email:pl.email,user_metadata:pl.user_metadata||{},app_metadata:pl.app_metadata||{}}}catch(e){u=null}}
    if(!u||!u.id)return null;
    const ei=+p.get('expires_in')||3600;
    return {access_token:at,refresh_token:p.get('refresh_token'),token_type:p.get('token_type')||'bearer',expires_in:ei,expires_at:+p.get('expires_at')||now()+ei,user:u}}
  const init=()=>initP||(initP=(async()=>{
    try{const hs=await fromHash();if(hs){await save(hs);return}}catch(e){}
    try{const raw=await st.getItem(SK);if(raw)sess=JSON.parse(raw)}catch(e){}})());
  async function getSession(){
    await init();
    if(sess&&sess.expires_at-now()<90){
      refP=refP||(async()=>{try{const n=await refresh(sess.refresh_token);await save(n);emit('TOKEN_REFRESHED',n)}catch(e){if(e.bad||sess.expires_at<=now())await drop()}finally{refP=null}})();
      await refP}
    return {data:{session:sess},error:null}}
  const token=async()=>{const s=(await getSession()).data.session;return s?s.access_token:key};
  class Q{
    constructor(t,raw){this.t=t;this.raw=raw;this.m='GET';this.p=new URLSearchParams();this.body=null;this.ret=false;this.cnt=false;this.res='';this.ord=[];this.one=''}
    select(c='*',o={}){this.p.set('select',c);if(this.m==='GET'||this.m==='HEAD'){if(o.count)this.cnt=true;if(o.head)this.m='HEAD'}else this.ret=true;return this}
    insert(b){this.m='POST';this.body=b;return this}
    update(b){this.m='PATCH';this.body=b;return this}
    upsert(b,o={}){this.m='POST';this.body=b;this.res=o.ignoreDuplicates?'ignore-duplicates':'merge-duplicates';if(o.onConflict)this.p.set('on_conflict',o.onConflict);return this}
    delete(){this.m='DELETE';return this}
    eq(c,v){this.p.append(c,'eq.'+v);return this}
    ilike(c,v){this.p.append(c,'ilike.'+v);return this}
    is(c,v){this.p.append(c,'is.'+(v===null?'null':v));return this}
    in(c,a){this.p.append(c,'in.('+a.map(x=>/[,()"]/.test(x)?'"'+String(x).replace(/"/g,'\\"')+'"':x).join(',')+')');return this}
    or(s){this.p.append('or','('+s+')');return this}
    match(o){for(const k in o)this.eq(k,o[k]);return this}
    order(c,o={}){this.ord.push(c+'.'+(o.ascending===false?'desc':'asc'));return this}
    limit(n){this.p.set('limit',n);return this}
    single(){this.one='single';return this}
    maybeSingle(){this.one='maybe';return this}
    then(a,b){return this.run().then(a,b)}
    async run(){
      const tok=await token();if(this.ord.length)this.p.set('order',this.ord.join(','));
      const h={apikey:key,Authorization:'Bearer '+tok},pf=[];
      if(this.cnt)pf.push('count=exact');
      if(!this.raw&&this.m!=='GET'&&this.m!=='HEAD')pf.push(this.ret?'return=representation':'return=minimal');
      if(this.res)pf.push('resolution='+this.res);
      if(pf.length)h.Prefer=pf.join(',');
      if(this.body!=null)h['Content-Type']='application/json';
      let r;try{r=await fetch(url+'/rest/v1/'+this.t+'?'+this.p,{method:this.m,headers:h,body:this.body!=null?JSON.stringify(this.body):undefined})}
      catch(e){return {data:null,error:{message:'нет соединения',code:''},count:null,status:0}}
      const tx=this.m==='HEAD'?'':await r.text();let d=null;if(tx){try{d=JSON.parse(tx)}catch(e){d=tx}}
      if(!r.ok)return {data:null,error:{message:(d&&d.message)||tx||('HTTP '+r.status),code:d&&d.code,details:d&&d.details},count:null,status:r.status};
      let cn=null;const cr=r.headers.get('content-range');if(cr&&cr.includes('/')){const n=cr.split('/')[1];if(n&&n!=='*')cn=+n}
      if(this.one&&Array.isArray(d)){
        if(d.length===1)d=d[0];
        else if(this.one==='maybe'&&d.length===0)d=null;
        else return {data:null,error:{message:'JSON object requested, multiple (or no) rows returned',code:'PGRST116'},count:cn,status:406}}
      return {data:d,error:null,count:cn,status:r.status}}
  }
  const sfetch=async(m,path,body,extra)=>{const tok=await token();
    try{const r=await fetch(url+'/storage/v1/'+path,{method:m,headers:{apikey:key,Authorization:'Bearer '+tok,...extra},body});const j=await r.json().catch(()=>({}));
      return r.ok?{data:j,error:null}:{data:null,error:{message:j.message||j.error||('HTTP '+r.status)}}}catch(e){return {data:null,error:{message:'нет соединения'}}}};
  const ep=p=>p.split('/').map(enc).join('/');
  const chan={on(){return chan},subscribe(){return chan}};
  return {
    auth:{getSession,
      onAuthStateChange(cb){subs.push(cb);return {data:{subscription:{unsubscribe(){const i=subs.indexOf(cb);if(i>=0)subs.splice(i,1)}}}}},
      async signInWithOAuth(o){location.href=url+'/auth/v1/authorize?provider='+enc(o.provider)+'&redirect_to='+enc((o.options&&o.options.redirectTo)||location.href.split(/[?#]/)[0]);return {data:{},error:null}},
      async signOut(){try{const t=sess&&sess.access_token;if(t)await fetch(url+'/auth/v1/logout',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+t}})}catch(e){}await drop();emit('SIGNED_OUT',null);return {error:null}}},
    from:t=>new Q(t),
    rpc:(n,a)=>{const q=new Q('rpc/'+n,true);q.m='POST';q.body=a||{};return q},
    storage:{from:b=>({
      upload:(path,blob,o={})=>sfetch('POST','object/'+b+'/'+ep(path),blob,{'Content-Type':o.contentType||blob.type||'application/octet-stream','x-upsert':String(!!o.upsert)}),
      remove:paths=>sfetch('DELETE','object/'+b,JSON.stringify({prefixes:paths}),{'Content-Type':'application/json'}),
      getPublicUrl:path=>({data:{publicUrl:url+'/storage/v1/object/public/'+b+'/'+ep(path)}})})},
    channel:()=>chan,removeAllChannels:async()=>{}
  };
}
window.supabase={createClient:createClient};
})();
</script>

function cropImage(file,done){
  const url=URL.createObjectURL(file),im=new Image();
  im.onerror=()=>toast('Не удалось открыть картинку');
  im.onload=()=>{
    const FW=Math.min(320,innerWidth-64);let FH,min,sc,x,y;
    const d=sheet(`<h2>Область бейджа</h2><div class="seg" style="margin-bottom:12px"><button data-ar="1">Квадрат</button><button data-ar="2">Широкий</button></div><div class="crf"><img draggable="false" alt="" src="${url}"></div><small style="display:block;text-align:center;margin-top:8px">Двигай картинку пальцем, масштаб — ползунком</small><input type="range" class="crz" min="1" max="4" step="0.01" value="1" style="width:100%;margin:12px 0;accent-color:var(--accent)"><button class="btn pri crok">Готово</button>`);
    const frame=d.querySelector('.crf'),img=frame.querySelector('img'),z=d.querySelector('.crz');
    const draw=()=>{const w=im.width*sc,hh=im.height*sc;x=Math.min(0,Math.max(FW-w,x));y=Math.min(0,Math.max(FH-hh,y));img.style.width=w+'px';img.style.height=hh+'px';img.style.transform=`translate(${x}px,${y}px)`};
    const setAr=a=>{FH=Math.round(FW/a);frame.style.width=FW+'px';frame.style.height=FH+'px';min=Math.max(FW/im.width,FH/im.height);z.value=1;sc=min;x=(FW-im.width*sc)/2;y=(FH-im.height*sc)/2;draw();d.querySelectorAll('[data-ar]').forEach(b=>b.classList.toggle('on',+b.dataset.ar===a))};
    z.oninput=()=>{const ns=min*z.value,cx=FW/2,cy=FH/2;x=cx-(cx-x)*ns/sc;y=cy-(cy-y)*ns/sc;sc=ns;draw()};
    let px=0,py=0,dr=false;
    frame.onpointerdown=e=>{dr=true;px=e.clientX;py=e.clientY;frame.setPointerCapture(e.pointerId)};
    frame.onpointermove=e=>{if(!dr)return;x+=e.clientX-px;y+=e.clientY-py;px=e.clientX;py=e.clientY;draw()};
    frame.onpointerup=frame.onpointercancel=()=>{dr=false};
    d.addEventListener('click',e=>{const a=e.target.closest('[data-ar]');if(a)setAr(+a.dataset.ar)});
    d.querySelector('.crok').onclick=()=>{const k=512/FW,c=document.createElement('canvas');c.width=512;c.height=Math.round(FH*k);
      c.getContext('2d').drawImage(im,x*k,y*k,im.width*sc*k,im.height*sc*k);c.toBlob(b=>{d.close();done(b)},'image/jpeg',.9)};
    setAr(1);
  };
  im.src=url;
}
