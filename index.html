<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1512">
<title>Orenix Music v0.4.12_fix-1</title>
<style>
/* Orenix Music v0.4.12 — стили */
:root{
  --bg-app:#0d1512; --bg-screen:#16211f; --bg-field:#1f2c29; --bg-card:#1f2c29; --border-hair:#263230;
  --text-primary:#f2f4ef; --text-secondary:#8b968f; --text-tertiary:#6d7873;
  --accent:#4fd6b4; --accent-fill:#2eb896; --accent-dark:#0d1f1a; --blue:#4a7cf0; --danger:#e2716a;
  --glass-bg:rgba(255,255,255,.06); --glass-border:rgba(255,255,255,.12);
  --glass-active-bg:rgba(46,184,150,.25); --glass-active-border:rgba(79,214,180,.35);
  --ios-glass:rgba(28,40,37,.66); --ios-spring:cubic-bezier(.32,1.38,.5,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{margin:0;background:var(--bg-app);color:var(--text-primary);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg.icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
small{color:var(--text-secondary)}
#app{min-height:100vh}

/* верхняя плашка с логотипом */
#tb{position:fixed;top:0;left:0;right:0;z-index:43;pointer-events:none;height:calc(env(safe-area-inset-top,0px) + 48px);
  background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,0));-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);
  -webkit-mask-image:linear-gradient(180deg,#000 55%,transparent);mask-image:linear-gradient(180deg,#000 55%,transparent)}
#gi{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);z-index:44;pointer-events:none;text-align:center}
#gi img{display:block;height:25px;border-radius:999px;box-shadow:0 8px 22px rgba(0,0,0,.42),0 0 0 .5px rgba(255,255,255,.18)}
#gi span{display:block;margin-top:3px;font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--text-secondary)}

/* шапка экрана: настройки слева, колокольчик/плюс справа */
.hd{display:flex;justify-content:space-between;align-items:center;height:calc(env(safe-area-inset-top,0px) + 60px);padding:env(safe-area-inset-top,0px) 16px 0;position:relative;z-index:45}
.ib{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;background:var(--glass-bg);border:.5px solid var(--glass-border);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.ib:active,.btn:active{background:var(--glass-active-bg);border-color:var(--glass-active-border)}
.pad{padding:0 16px}

/* секции и горизонтальные карусели */
.sec{margin-top:18px}
.sh{display:flex;justify-content:space-between;align-items:center;padding:0 16px 10px}
.sh h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
.hs{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;scroll-snap-type:x proximity;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.card{flex:none;width:128px;position:relative;scroll-snap-align:start;cursor:pointer}
.card b{display:block;margin-top:6px;font-size:14px}
.card b,.card small,.row .t b,.row .t small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{display:block;font-size:12px}
.cov{display:block;width:128px;height:128px;border-radius:18px;object-fit:cover;background:linear-gradient(135deg,var(--blue),var(--accent));border:.5px solid var(--glass-border)}
.empty{padding:6px 16px;color:var(--text-tertiary)}

/* строки списков */
.row{display:flex;align-items:center;gap:12px;padding:8px;margin:8px 0;border-radius:16px;background:var(--bg-card);border:.5px solid var(--border-hair);cursor:pointer}
.row .cov,.row .av{width:48px;height:48px;border-radius:12px;flex:none}
.row .t{flex:1;min-width:0}.row .t b,.row .t small{display:block}
.row .ib{width:32px;height:32px;color:var(--accent)}

/* экраны-оверлеи, шторки, поля, кнопки */
.ov{position:fixed;inset:0;z-index:60;background:var(--bg-screen);overflow:auto;padding:0 16px}
.ovh{display:flex;align-items:center;gap:12px;height:calc(env(safe-area-inset-top,0px) + 60px);padding-top:env(safe-area-inset-top,0px);position:sticky;top:0;z-index:2}
.ovh h2{flex:1;margin:0;font-size:20px;text-align:center}
.shade{position:fixed;inset:0;z-index:69;background:rgba(0,0,0,.5)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;max-height:88vh;overflow:auto;background:var(--bg-screen);border-radius:26px 26px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));border-top:.5px solid var(--glass-border)}
.sheet h2{margin:0 0 12px;font-size:20px}
.in{display:block;width:100%;padding:12px 14px;margin:8px 0;font:inherit;color:var(--text-primary);background:var(--bg-field);border:.5px solid var(--border-hair);border-radius:14px;outline:0}
.in::placeholder{color:var(--text-tertiary)}.in:focus{border-color:var(--glass-active-border)}
.btn{display:block;width:100%;padding:13px 18px;margin:8px 0;border-radius:999px;font-weight:600;text-align:center;background:var(--glass-bg);border:.5px solid var(--glass-border);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.btn.pri{background:var(--accent-fill);color:var(--accent-dark);border-color:transparent}
.btn.dng{color:var(--danger)}.btn:disabled{opacity:.5}
.upl{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.pg{flex:1;min-width:0}.pg span{display:block;font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cpick{display:flex;align-items:center;gap:12px}.cpick .cov{width:72px;height:72px;border-radius:14px}.cpick .btn{width:auto;margin:0}
.pick.sel{background:var(--glass-active-bg);border-color:var(--glass-active-border)}

/* профиль */
.av{display:grid;place-items:center;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--blue),var(--accent));font-weight:700;color:#fff}
.pf{text-align:center;padding:0 16px}.pf .av{margin:0 auto 10px}
.pf h1{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:24px}
.vf{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent-fill);color:var(--accent-dark);font-size:11px}
.cnt{display:flex;justify-content:center;gap:28px;margin:12px 0}.cnt b{display:block;font-size:18px}.cnt small{font-size:12px}

/* мини-плеер и тост */
#mp{position:relative;display:flex;align-items:center;gap:10px;width:min(calc(100vw - 24px),420px);height:66px;padding:7px 10px 7px 7px;overflow:hidden;touch-action:pan-y;border-radius:32px;background:var(--ios-glass);-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);border:.5px solid rgba(255,255,255,.15);box-shadow:0 12px 32px rgba(0,0,0,.4)}
#mp[hidden]{display:none}
#mp .t{flex:1;min-width:0}#mp .t b,#mp .t small{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{width:max-content;max-width:calc(100vw - 32px);text-align:center;position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);left:50%;transform:translate(-50%,-10px);z-index:99;padding:9px 16px;border-radius:999px;background:var(--ios-glass);border:.5px solid var(--glass-border);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-size:14px;opacity:0;pointer-events:none;transition:.25s}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* нижний навбар */
.nav{display:flex;justify-content:center;--nw:48px;--ng:4px}
.nav-island{position:relative;display:flex;gap:var(--ng);padding:5px;border-radius:34px;background:var(--ios-glass);-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);border:.5px solid rgba(255,255,255,.15);box-shadow:0 16px 42px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.12)}
.nav-ind{position:absolute;top:5px;left:5px;width:var(--nw);height:var(--nw);border-radius:50%;background:rgba(130,138,134,.20);border:.5px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);transform:translateX(calc(var(--i,0) * (var(--nw) + var(--ng))));transition:transform .6s cubic-bezier(.3,1.2,.4,1)}
.nav-btn{position:relative;z-index:1;width:var(--nw);height:var(--nw);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.nav-btn svg{color:#aab3ad;width:22px;height:22px;transition:color .3s,transform .45s var(--ios-spring)}
.nav-btn.active svg{color:var(--accent);transform:scale(1.1)}.nav-btn:active{transform:scale(.92)}
.nav-btn .av{transition:box-shadow .3s}.nav-btn.active .av{box-shadow:0 0 0 2px var(--accent)}

/* v0.4.1: треки колонками по 3, как в референсе */
.tc{display:grid;grid-template-rows:repeat(3,auto);grid-auto-flow:column;grid-auto-columns:calc(100vw - 64px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 4px;scrollbar-width:none}
.tc::-webkit-scrollbar{display:none}
.tc .tr{scroll-snap-align:start}
.tr{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer}
.tr:active{opacity:.7}
.tr .cov{width:56px;height:56px;border-radius:14px;flex:none}
.tr .t{flex:1;min-width:0}
.tr .t b,.tr .t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .t b{font-size:16px;font-weight:600}.tr .t small{font-size:14px}
.tr .du{font-size:14px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.tr .rk{width:22px;text-align:center;font-weight:600;color:var(--text-secondary)}
.tr .x{color:var(--danger);font-size:14px;padding:6px}
.ov .tr{padding:8px 0}
/* мини-плеер: линия прогресса сверху, ♥, пауза, дальше */
#lk{color:var(--accent)}

/* ===== v0.4.2 ===== */
.shb{display:flex;gap:8px}
/* строка трека: меню-троеточие */
.tr{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.tr .x{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;flex:none;padding:0;color:var(--text-secondary);font-size:inherit}
.tr .x:active{background:var(--glass-active-bg);color:var(--accent)}
.tr .x svg{width:20px;height:20px}
/* меню трека (стекло) */
.sheet.glass{background:rgba(22,33,31,.8);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border-top:.5px solid rgba(255,255,255,.18);box-shadow:0 -12px 40px rgba(0,0,0,.45)}
.mhead{display:flex;align-items:center;gap:14px;padding-bottom:14px;margin-bottom:4px;border-bottom:.5px solid var(--glass-border)}
.mhead .cov{width:68px;height:68px;border-radius:16px;flex:none}
.mhead .t{min-width:0}.mhead b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhead small{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:14px 6px;font-size:16px;text-align:left;border-bottom:.5px solid var(--border-hair);border-radius:12px}
.mi:last-child{border-bottom:0}.mi svg{color:var(--accent)}
.mi:active{background:var(--glass-active-bg)}
.mi.dng,.mi.dng svg{color:var(--danger)}
/* таблетка плеера: фиксированный размер */
#mp .t b{font-size:15px;font-weight:600;line-height:1.25}#mp .t small{font-size:13px;line-height:1.25}
.pb2{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--text-primary);background:var(--glass-bg);border:.5px solid var(--glass-border);transition:transform .15s,background .2s}
.pb2:active{transform:scale(.9)}
.pb2 svg{width:21px;height:21px}
.pb2.main{background:var(--accent-fill);border-color:transparent;color:var(--accent-dark)}
.icon.f{fill:currentColor;stroke:currentColor;stroke-width:1.4}
#lk.on{background:var(--glass-active-bg);border-color:var(--glass-active-border);color:var(--accent)}
#lk.on svg{fill:var(--accent)}
/* прогресс загрузки */
.bar{height:6px;margin-top:8px;border-radius:3px;background:var(--border-hair);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--accent-fill),var(--accent));transition:width .15s}
.err{margin:2px 0 6px;font-size:13px;color:var(--danger)}.err:empty{display:none}

/* ===== v0.4.3 ===== */
/* таблетка: винил, заливка прогресса, свайп */
#mp::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(90deg,rgba(150,235,210,.20) var(--pg,0%),rgba(150,235,210,0) var(--pg,0%))}
#mp>*{position:relative;z-index:1}
.vinyl{position:relative;width:52px;height:52px;flex:none;border-radius:50%;
  background:conic-gradient(from 20deg,#0f1413,#1c2523 12%,#0f1413 25%,#1c2523 38%,#0f1413 50%,#1c2523 62%,#0f1413 75%,#1c2523 88%,#0f1413);
  box-shadow:0 4px 14px rgba(0,0,0,.45),inset 0 0 0 .5px rgba(255,255,255,.18)}
.vinyl::before{content:"";position:absolute;inset:3px;border-radius:50%;background:repeating-radial-gradient(circle,rgba(255,255,255,0) 0 1.6px,rgba(255,255,255,.07) 1.6px 2.2px)}
.vinyl::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--bg-app);box-shadow:0 0 0 1px rgba(255,255,255,.22);z-index:3}
#mp #mpc{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:0;z-index:2}
.vinyl.spin{animation:vspin 5s linear infinite}
@keyframes vspin{to{transform:rotate(360deg)}}
#mp.mswl>.t{animation:swl .28s ease}#mp.mswr>.t{animation:swr .28s ease}
@keyframes swl{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes swr{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
/* профиль */
.pcard{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;margin:4px 16px 0;padding:16px;border-radius:26px;background:var(--bg-card);border:.5px solid var(--border-hair)}
.pcard::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 0% 0%,rgba(79,214,180,.14),transparent 60%)}
.pcard>*{position:relative}
.pcard .av{width:92px;height:92px;flex:none;box-shadow:0 0 0 3px var(--bg-card),0 0 0 4.5px var(--glass-active-border)}
.pc-main{flex:1;min-width:0}
.pc-name{display:flex;align-items:center;gap:6px}
.pc-name h1{margin:0;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-cnt{display:flex;align-items:center;gap:12px;margin:8px 0 8px}
.pc-cnt b{display:block;font-size:18px;line-height:1.1}.pc-cnt small{font-size:12px}
.pc-cnt i{width:1px;height:26px;background:var(--border-hair)}
.pc-ban{flex:none;align-self:stretch;min-width:44px;display:grid;place-items:center;border-radius:18px;border:1px dashed var(--glass-border);background:var(--glass-bg);color:var(--text-tertiary);font-size:22px}
.mrow{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;margin:8px 0;border-radius:20px;font-size:16px;text-align:left;background:var(--bg-card);border:.5px solid var(--border-hair)}
.mrow:active{background:var(--glass-active-bg);border-color:var(--glass-active-border)}
.mrow>span:nth-child(2){flex:1;min-width:0}
.mrow>svg:last-child{width:18px;height:18px;color:var(--text-tertiary)}
.mi-ic{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;overflow:hidden;flex:none;color:var(--accent);background:var(--glass-active-bg);border:.5px solid var(--glass-active-border)}
.mi-ic .av{width:36px!important;height:36px!important;border-radius:12px}
.mrow.dng{color:var(--danger)}.mrow.dng .mi-ic{color:var(--danger);background:rgba(226,113,106,.14);border-color:rgba(226,113,106,.35)}
.tag{font-size:12px;color:var(--text-tertiary);padding:3px 10px;border-radius:999px;background:var(--glass-bg);border:.5px solid var(--glass-border)}
.ft{text-align:center;padding:26px 0 8px;font-size:13px;color:var(--text-tertiary)}.ft a{color:var(--accent);text-decoration:none}
/* статистика */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 14px}
.tile{padding:14px 6px;text-align:center;border-radius:18px;background:var(--bg-card);border:.5px solid var(--border-hair)}
.tile b{display:block;font-size:24px;line-height:1.1;color:var(--accent)}.tile small{font-size:12px}
.sh3{margin:6px 0;font-size:14px;font-weight:600;color:var(--text-secondary)}

/* ===== v0.4.4: колокольчик и уведомления ===== */
.ib{position:relative}
.hr{display:flex;gap:8px}
.bd{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center;border-radius:9px;font-size:10px;font-weight:700;font-style:normal;color:#fff;background:var(--danger);border:1.5px solid var(--bg-screen)}
.nr.new{background:var(--glass-active-bg);border-color:var(--glass-active-border)}
.nr .t small{white-space:normal}
.nr .av{border-radius:50%!important}

/* ===== v0.4.6 ===== */
/* док: плеер и навбар в одном блоке, контент не перекрывается */
#dock{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:65;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#dock>*{pointer-events:auto}
/* лёгкий градиент на фоне страниц */
#app,.ov{background:linear-gradient(180deg,rgba(79,214,180,.09),rgba(79,214,180,0) 340px),radial-gradient(90% 45% at 100% 0%,rgba(74,124,240,.08),transparent),var(--bg-screen)}
/* медали топ-3 */
.tr .rk{width:28px;display:grid;place-items:center}
.md{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:800;color:#2b2200;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 6px rgba(0,0,0,.35)}
/* бейджи */
.bchip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--bc);background:color-mix(in srgb,var(--bc) 16%,transparent);border:.5px solid color-mix(in srgb,var(--bc) 40%,transparent)}
.bsym{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;flex:none;font-size:20px;color:var(--bc);background:color-mix(in srgb,var(--bc) 16%,transparent);border:.5px solid color-mix(in srgb,var(--bc) 40%,transparent)}
.bsym.off{filter:grayscale(1);opacity:.4}
/* профиль с кастомным цветом */
.pcard::before{background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--pa,#4fd6b4) 24%,transparent),transparent 60%)}
.pcard .av{box-shadow:0 0 0 3px var(--bg-card),0 0 0 5px var(--pa,var(--glass-active-border))}
.pcard.nofr .av{box-shadow:none}
.pc-bio{font-size:13px;color:var(--text-secondary);margin:2px 0}
.pc-name{flex-wrap:wrap}
.pal{display:flex;gap:10px;margin:8px 0 14px}
.swt{width:34px;height:34px;border-radius:50%;background:var(--c);border:2px solid transparent;box-shadow:0 0 0 1px var(--glass-border)}
.swt.on{border-color:var(--text-primary)}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px;border-radius:14px;background:var(--glass-bg);border:.5px solid var(--glass-border)}
.seg button.on{background:var(--glass-active-bg);border-color:var(--glass-active-border);color:var(--accent)}
textarea.in{resize:none}
/* переключатели настроек */
.swr{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:.5px solid var(--border-hair)}
.swr>div{flex:1;min-width:0}
.sw{position:relative;width:50px;height:30px;flex:none;border-radius:15px;background:var(--glass-bg);border:.5px solid var(--glass-border);transition:background .25s}

.sw.on{background:var(--accent-fill);border-color:transparent}.sw.on::after{left:22px}

.sr{display:flex;justify-content:space-between;align-items:center}
.lnk{font-size:13px;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}

.chip2 button{padding:8px 12px;font-size:14px}
.chip2 button+button{padding-left:0;color:var(--text-tertiary)}
button.chip2{padding:8px 14px;font-size:14px}
.chip2.pop i{font-style:normal;color:var(--accent);font-weight:700;margin-right:6px}

/* ===== v0.4.7 ===== */
#gi span{display:none}
/* док выше: в полноэкранном режиме не залезает на системную панель */
#dock{bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
#app,.ov{padding-bottom:calc(var(--dock-h,100px) + 40px + env(safe-area-inset-bottom,0px))}
/* треки: отступ от края экрана и при снапе */
.tc{column-gap:16px;row-gap:14px;scroll-padding-left:16px;scroll-padding-right:16px}
.hs{scroll-padding-left:16px;scroll-padding-right:16px}
/* медальки */
.tr .rk{width:30px}
.md{display:inline-block;width:24px;height:30px;border-radius:0;background:none;box-shadow:none;line-height:0}
.md svg{width:24px;height:30px;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.pc-name .md{width:20px;height:25px}.pc-name .md svg{width:20px;height:25px}
/* бейджи-картинки */
.pc-ban{width:64px;min-width:64px;padding:0;overflow:hidden}
.pc-ban.has{border:.5px solid var(--glass-border)}
.pc-ban .bimg{width:100%;height:100%;object-fit:cover;display:block}
.pc-ban svg{width:26px;height:26px}
.bsym{overflow:hidden}.bsym img.bi{width:100%;height:100%;object-fit:cover;display:block}
.bchi{width:18px;height:18px;border-radius:6px;object-fit:cover}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.bpk{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:16px;background:var(--glass-bg);border:.5px solid var(--glass-border)}
.bpk.on{border-color:var(--accent);background:var(--glass-active-bg)}
.bpk .bsym{width:64px;height:64px;border-radius:16px}
.bpk small{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* кнопки входа с иконками */
.btn-ic{display:flex;align-items:center;justify-content:center;gap:10px}
.gic{width:22px;height:22px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}.gic svg{width:14px;height:14px}
.oxi{width:22px;height:20px;object-fit:contain;flex:none}
.mi-ic .oxi{width:22px;height:20px}
/* верхние кнопки ниже */
:root{--tl:36px}
.hd{height:calc(env(safe-area-inset-top,0px) + 60px + var(--tl));padding-top:calc(env(safe-area-inset-top,0px) + var(--tl))}
.ovh{height:calc(env(safe-area-inset-top,0px) + 60px + var(--tl));padding-top:calc(env(safe-area-inset-top,0px) + var(--tl))}
#gi{top:calc(env(safe-area-inset-top,0px) + 10px + var(--tl))}
#tb{height:calc(env(safe-area-inset-top,0px) + 48px + var(--tl))}
#toast{top:calc(env(safe-area-inset-top,0px) + 64px + var(--tl))}
/* ===== v0.4.8: отображение бейджа ===== */
.pcard>.pc-fade{position:absolute;top:0;right:0;bottom:0;width:60%;z-index:0;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,rgba(0,0,0,.55) 38%,#000 78%),linear-gradient(180deg,transparent,#000 22%,#000 78%,transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent,rgba(0,0,0,.55) 38%,#000 78%),linear-gradient(180deg,transparent,#000 22%,#000 78%,transparent);mask-composite:intersect}
.pc-fade img{width:100%;height:100%;object-fit:cover;display:block;opacity:.9}
.pcard>.av,.pcard>.pc-main{z-index:1}
.pcard.hasfade .pc-main{text-shadow:0 1px 8px rgba(0,0,0,.65)}
.pcard.ed>*:not(.pc-fade):not(.pc-ban){pointer-events:none}
/* кадрирование картинки бейджа */
.crf{position:relative;overflow:hidden;margin:0 auto;border-radius:18px;background:#000;border:.5px solid var(--glass-border);touch-action:none}
.crf img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;user-select:none;-webkit-user-drag:none;pointer-events:none}
/* ===== v0.4.10 ===== */
/* винил: пауза не сбрасывает угол */
.vinyl{animation:vspin 5s linear infinite;animation-play-state:paused}
.vinyl.spin{animation-play-state:running}
/* полноэкранный плеер */
.fp{position:fixed;inset:0;z-index:65;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 24px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--bg-screen);overflow:hidden;animation:fpIn .46s cubic-bezier(.2,.9,.3,1);touch-action:none}
.fp.out{animation:fpOut .3s cubic-bezier(.4,0,1,1) forwards;pointer-events:none}
@keyframes fpIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes fpOut{to{transform:translateY(100%)}}
.fp::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,22,20,.3),rgba(15,22,20,.88));z-index:0;pointer-events:none}
.fp>*{position:relative;z-index:1}
.fp>.fp-bg{position:absolute;inset:-60px;z-index:0;background-size:cover;background-position:center;filter:blur(55px) saturate(1.7);opacity:.6;transition:background-image .6s}
.fp-top{display:flex;align-items:center;justify-content:space-between;height:46px;flex:none}
.fp-top .ib svg{width:22px;height:22px}
.fp-lbl{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-secondary)}
.fp-art{flex:1;display:grid;place-items:center;min-height:0;padding:12px 0 28px}
.fp-art .cov{width:min(100%,calc(100vh - 440px),340px);height:auto;aspect-ratio:1;border-radius:28px;box-shadow:0 24px 60px rgba(0,0,0,.5);transition:transform .55s cubic-bezier(.34,1.4,.5,1)}
.fp:not(.playing) .fp-art .cov{transform:scale(.86)}
.fp-art .cov.swap{animation:fpSwap .45s ease}
@keyframes fpSwap{from{opacity:0;transform:scale(.9)}to{opacity:1}}
.fp-info{display:flex;align-items:center;gap:12px;flex:none}
.fp-t{flex:1;min-width:0}
.fp-t b{display:block;font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-t small{display:block;font-size:16px;color:var(--text-secondary);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#flk{color:var(--accent);flex:none}#flk.on svg{fill:currentColor}#flk.on svg{animation:pop .4s ease}
.fp-seek{margin-top:16px;padding:12px 0 2px;touch-action:none;cursor:pointer;flex:none}
.fp-bar{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.fp-bar i{position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);border-radius:3px;background:var(--accent)}
.fp-bar u{position:absolute;top:50%;left:var(--p,0%);width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:transform .15s}
.fp-seek.drag .fp-bar u{transform:scale(1.4)}
.fp-times{display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);margin-top:10px;font-variant-numeric:tabular-nums}
.fp-ctl{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:20px;flex:none}
.fp-ctl .pb2{width:58px;height:58px}.fp-ctl .pb2.big{width:78px;height:78px}
.fp-ctl .pb2 svg{width:26px;height:26px}.fp-ctl .big svg{width:32px;height:32px}
.fp .pv svg{transform:scaleX(-1)}
.flip{transform:rotate(180deg)}
/* плейлисты */
.plh{display:flex;gap:16px;align-items:center;margin:6px 0 14px}
.plh .plcv{width:132px;height:132px;border-radius:24px;flex:none;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.pli{min-width:0;display:flex;flex-direction:column;gap:4px}
.pli b{font-size:21px;line-height:1.2;word-break:break-word}.pli small{color:var(--text-secondary);font-size:13px}
.plb{display:flex;gap:10px;margin-bottom:10px}
.plb .btn{flex:1;margin:0;display:flex;align-items:center;justify-content:center;gap:8px}.plb svg{width:18px;height:18px}
.plr{min-width:38px;display:flex;justify-content:flex-end}
/* анимации */
@keyframes orxUp{from{opacity:0;transform:translateY(14px)}}

@keyframes ovOut{to{opacity:0;transform:translateX(28px)}}

@keyframes sheetDn{to{transform:translateY(100%)}}

.skw{padding:6px 0}

  .tc .tr{animation:orxUp .4s cubic-bezier(.2,.8,.2,1) backwards}
  .tc .tr:nth-child(2){animation-delay:.04s}.tc .tr:nth-child(3){animation-delay:.08s}

  .mrow,.mi,.chip2,.seg button,.swt,.bpk,.pick{transition:transform .16s ease,background .2s ease,border-color .2s ease}
  .mrow:active,.mi:active,.bpk:active{transform:scale(.98)}

  .btn,.ib,.pb2{transition:transform .15s ease,background .2s ease}.btn:active,.ib:active{transform:scale(.96)}
}

(function(){

  const drop=async()=>{sess=null;try{await st.removeItem(SK)}catch(e){}};
  const norm=j=>({access_token:j.access_token,refresh_token:j.refresh_token,token_type:j.token_type||'bearer',expires_in:j.expires_in,expires_at:j.expires_at||now()+(+j.expires_in||3600),user:j.user});

  async function fromHash(){
    if(!/access_token=/.test(location.hash))return null;
    const p=new URLSearchParams(location.hash.replace(/^#/,'')),at=p.get('access_token');

function cropImage(file,done,sq,opt){
  const url=URL.createObjectURL(file),im=new Image();
  im.onerror=()=>{URL.revokeObjectURL(url);toast('Не удалось открыть картинку')};
  im.onload=()=>{
    const FW=Math.min(320,innerWidth-64);let FH,min,sc,x,y;
    const d=sheet(`<h2>${opt&&opt.title||'Область бейджа'}</h2>${(sq||opt)?'':'<div class="seg" style="margin-bottom:12px"><button data-ar="1">Квадрат</button><button data-ar="2">Широкий</button></div>'}<div class="crf"><img draggable="false" alt="" src="${url}"></div><small style="display:block;text-align:center;margin-top:8px">Двигай картинку пальцем, масштаб — ползунком</small><input type="range" class="crz" min="1" max="4" step="0.01" value="1" style="width:100%;margin:12px 0;accent-color:var(--accent)"><button class="btn pri crok">Готово</button>`);
    d.onclose=()=>URL.revokeObjectURL(url);
    const frame=d.querySelector('.crf'),img=frame.querySelector('img'),z=d.querySelector('.crz');
    const draw=()=>{const w=im.width*sc,hh=im.height*sc;x=Math.min(0,Math.max(FW-w,x));y=Math.min(0,Math.max(FH-hh,y));img.style.width=w+'px';img.style.height=hh+'px';img.style.transform=`translate(${x}px,${y}px)`};
    const setAr=a=>{FH=Math.round(FW/a);frame.style.width=FW+'px';frame.style.height=FH+'px';min=Math.max(FW/im.width,FH/im.height);z.value=1;sc=min;x=(FW-im.width*sc)/2;y=(FH-im.height*sc)/2;draw();d.querySelectorAll('[data-ar]').forEach(b=>b.classList.toggle('on',+b.dataset.ar===a))};
    z.oninput=()=>{const ns=min*z.value,cx=FW/2,cy=FH/2;x=cx-(cx-x)*ns/sc;y=cy-(cy-y)*ns/sc;sc=ns;draw()};
    let px=0,py=0,dr=false;
    frame.onpointerdown=e=>{dr=true;px=e.clientX;py=e.clientY;frame.setPointerCapture(e.pointerId)};
    frame.onpointermove=e=>{if(!dr)return;x+=e.clientX-px;y+=e.clientY-py;px=e.clientX;py=e.clientY;draw()};
    frame.onpointerup=frame.onpointercancel=()=>{dr=false};
    d.addEventListener('click',e=>{const a=e.target.closest('[data-ar]');if(a)setAr(+a.dataset.ar)});
    d.querySelector('.crok').onclick=()=>{const OW=(opt&&opt.w)||512,k=OW/FW,c=document.createElement('canvas');c.width=OW;c.height=Math.round(FH*k);
      c.getContext('2d').drawImage(im,x*k,y*k,im.width*sc*k,im.height*sc*k);c.toBlob(b=>{d.close();done(b)},'image/jpeg',.9)};
    setAr(opt&&opt.ar||1);
  };
  im.src=url;
}

const IMG=new Map(),BADIMG=new Set();
async function cached(img){
  const u=img.dataset.src;if(!u){img.src=BLANK;delete img.dataset.hy;return}
  if(img.dataset.hy===u)return;img.dataset.hy=u;
  const put=v=>{if(img.dataset.src!==u)return;img.onload=()=>{img.classList.remove('fadein');void img.offsetWidth;img.classList.add('fadein')};img.src=v};
  if(IMG.has(u))return put(IMG.get(u));
  if(BADIMG.has(u))return put(u);
  try{const c=await caches.open('orx-covers');let r=await c.match(u);if(!r){await c.add(u);r=await c.match(u)}
    const b=URL.createObjectURL(await r.blob());IMG.set(u,b);
    if(IMG.size>300){const k=IMG.keys().next().value;URL.revokeObjectURL(IMG.get(k));IMG.delete(k)}
    put(b)}
  catch(e){BADIMG.add(u);put(u)}}

async function upXhr(path,file,type,onp){
  const ss=(await sb.auth.getSession()).data.session;if(!ss)return {error:{message:'нужно войти'}};
  return new Promise(res=>{
  const x=new XMLHttpRequest();x.open('POST',SB_URL+'/storage/v1/object/tracks/'+path);
  x.setRequestHeader('Authorization','Bearer '+ss.access_token);x.setRequestHeader('apikey',SB_KEY);x.setRequestHeader('Content-Type',type);
  x.upload.onprogress=e=>e.lengthComputable&&onp(e.loaded,e.total);
  x.onload=()=>{let m='';try{m=JSON.parse(x.responseText).message}catch(e){}res(x.status<300?{}:{error:{message:m||('HTTP '+x.status)}})};
  x.onerror=x.onabort=()=>res({error:{message:'нет соединения'}});x.send(file)})}

async function autoCache(url,force){

  const c=await caches.open('orx-audio');if(await c.match(url))return;
  const r=await fetch(url);if(!r.ok)throw new Error('http '+r.status);const b=await r.clone().blob();await c.put(url,r);
  const idx=ls.get('orx_idx',[]).filter(x=>x.u!==url);idx.push({u:url,s:b.size});let tot=idx.reduce((a,x)=>a+x.s,0);const lim=SET.cache_mb*1048576;

    <button class="btn pri" data-plsv>Сохранить</button>`);
  hydrate(d);const im=d.querySelector('.cov');
  d.querySelector('[data-plcv]').onclick=()=>pickFile(f=>cropImage(f,b=>{nf=b;previewSrc(im,b)},true));
  d.querySelector('[data-plsv]').onclick=async()=>{const ti=d.querySelector('[data-plt]').value.trim();if(!ti)return toast('Введите название');
    const u={title:ti,is_public:d.querySelector('[data-plpr]').value==='1'};
    if(nf){const url=await putImage('covers',nf);if(!url)return toast('Не удалось загрузить обложку');u.cover_url=url}
    const r=await sb.from('playlists').update(u).eq('id',pl.id);if(r.error)return toast('Ошибка: '+r.error.message);
    d.close();toast('Сохранено');el.refresh()};
}
async function plAddTracks(pl,el,tr){
  const have=new Set(tr.map(x=>x.id)),{data}=await TQ().order('created_at',{ascending:false}).limit(300),list=(data||[]).filter(x=>!have.has(x.id)),sel=new Set();
  const ov=openOv('Добавить треки',list.map((t,i)=>`<div class="row pick" data-pick="${i}">${cov(t.artwork_url)}<div class="t"><b>${esc(t.title)}</b><small>${esc(t.artist)}</small></div></div>`).join('')||'<div class="empty">Новых треков нет</div>');
  ov.onclick=e=>{const r=e.target.closest('[data-pick]');if(!r)return;const id=list[+r.dataset.pick].id;sel.has(id)?sel.delete(id):sel.add(id);r.classList.toggle('sel')};
  ov.onclose=async()=>{if(!sel.size)return;
    const mx=await sb.from('playlist_tracks').select('position').eq('playlist_id',pl.id).order('position',{ascending:false}).limit(1),p0=mx.data&&mx.data[0]?mx.data[0].position+1:0;
    const x=await sb.from('playlist_tracks').insert([...sel].map((t,i)=>({playlist_id:pl.id,track_id:t,position:p0+i})));
    toast(x.error?'Ошибка: '+x.error.message:'Добавлено: '+sel.size);el.refresh()};
}
function plDelete(pl,el){
  const d=sheet(`<h2>Удалить плейлист?</h2><p style="color:var(--text-secondary);margin:0 0 12px">«${esc(pl.title)}» и его состав будут удалены.</p><button class="btn dng" data-plok>Удалить</button><button class="btn" data-plno>Отмена</button>`);
  d.onclick=async e=>{if(e.target.closest('[data-plno]'))return d.close();if(!e.target.closest('[data-plok]'))return;
    await sb.from('playlist_tracks').delete().eq('playlist_id',pl.id);await sb.from('playlist_likes').delete().eq('playlist_id',pl.id);
    const r=await sb.from('playlists').delete().eq('id',pl.id);if(r.error)return toast('Ошибка: '+r.error.message);
    d.close();el.close();toast('Плейлист удалён');go(view)};

async function plAction(pc,t,a){
  if(!pc)return;const id=pc.dataset.plov;
  const r=await sb.from('playlist_tracks').select('track_id,position').eq('playlist_id',id).order('position');
  const ids=(r.data||[]).map(x=>x.track_id),i=ids.indexOf(t.id);if(i<0)return;
  if(a==='rmpl'){ids.splice(i,1);const x=await sb.from('playlist_tracks').delete().match({playlist_id:id,track_id:t.id});if(x.error)return toast('Нет доступа: '+x.error.message);toast('Убрано из плейлиста')}
  else{const j=a==='up'?i-1:i+1;if(j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]]}
  await Promise.all(ids.map((tid,k)=>sb.from('playlist_tracks').update({position:k}).match({playlist_id:id,track_id:tid})));
  pc.refresh&&pc.refresh();
}
async function openUser(id){
  if(typeof id!=='string')return;
  const [s,t,f]=await Promise.all([stats(id),TQ().eq('uploader_id',id).order('created_at',{ascending:false}),S?sb.from('follows').select('*').match({follower_id:S.user.id,following_id:id}):{data:[]}]);
  if(!s.id)return toast('Пользователь не найден');
  let on=(f.data||[]).length>0;const mine=S&&S.user.id===id;
  const el=openOv(s.username,`${profCard(s)}${mine?'':`<div class="pad" style="margin:12px 0"><button class="btn pri" id="fw">${on?'Вы подписаны':'Подписаться'}</button></div>`}${(!mine&&s.priv&&s.priv.hide_uploads)?'<div class="empty" style="padding:18px 0;text-align:center">Пользователь скрыл свои загрузки</div>':lst(t.data||[],trow)}`);
  const b=el.querySelector('#fw');if(b)b.onclick=async()=>{if(!S)return signIn();const m={follower_id:S.user.id,following_id:id};b.disabled=true;
    const r=await(on?sb.from('follows').delete().match(m):sb.from('follows').insert(m));b.disabled=false;
    if(r.error&&r.error.code!=='23505')return toast('Не удалось: '+r.error.message);
    on=!on;b.textContent=on?'Вы подписаны':'Подписаться';const c=el.querySelector('.pc-cnt b');if(c)c.textContent=Math.max(0,+c.textContent+(on?1:-1))};
}
async function editProfile(){
  const s=await stats(S.user.id),st=s.style||{},PAL=['#4fd6b4','#4a7cf0','#a78bfa','#f472b6','#fbbf24'];
  const bl=((await sb.from('user_badges').select('badges(*)').eq('user_id',S.user.id)).data||[]).map(x=>x.badges).filter(Boolean);
  const base={username:s.username,bio:s.bio||'',accent:st.accent||PAL[0],frame:st.frame||'ring',bmode:st.bmode==='off'?'off':'on',badge:s.pinned_badge_id||null};let cur={...base},af=null,aurl=null,bf=null,brm=false,bnu=null;
  const el=openOv('Изменить профиль',`<div id="pvw"></div><button class="mrow" id="pa"><span class="mi-ic">${ic('user')}</span><span>Сменить фото</span>${ic('more')}</button><input type="file" id="paf" accept="image/*" hidden>
    <input class="in" id="pnm" maxlength="24" placeholder="Имя" value="${esc(base.username)}"><textarea class="in" id="pbio" maxlength="80" rows="2" placeholder="О себе">${esc(base.bio)}</textarea>
    <div class="sh3">Цвет профиля</div><div class="pal">${PAL.map(c=>`<button class="swt" data-c="${c}" style="--c:${c}"></button>`).join('')}</div>
    <div class="sh3">Рамка аватара</div><div class="seg"><button data-f="ring">Кольцо</button><button data-f="none">Без рамки</button></div>
    <div class="sh3" style="margin-top:14px">Баннер</div><div class="seg"><button data-bn="pick">Сменить</button><button data-bn="rm">Убрать</button></div><div class="sh3" style="margin-top:14px">Бейдж у аватара</div><div class="seg"><button data-bm="on">Показывать</button><button data-bm="off">Скрыть</button></div>`,'<button class="ib" id="psv" style="width:auto;padding:0 16px;font-weight:600;color:var(--accent)" disabled>Готово</button>');
  const dirty=()=>cur.username!==base.username||cur.bio!==base.bio||cur.accent!==base.accent||cur.frame!==base.frame||cur.badge!==base.badge||cur.bmode!==base.bmode||!!af||!!bf||brm;
  const paint=()=>{el.querySelector('#pvw').innerHTML=profCard({...s,username:cur.username||'Имя',bio:cur.bio,style:{accent:cur.accent,frame:cur.frame,bmode:cur.bmode},avatar_url:aurl||s.avatar_url,banner_url:brm?null:(bnu||s.banner_url),pb:bl.find(b=>b.id===cur.badge)||null},1);hydrate(el);
    el.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('on',b.dataset.c===cur.accent));el.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('on',b.dataset.f===cur.frame));el.querySelectorAll('[data-bm]').forEach(b=>b.classList.toggle('on',b.dataset.bm===cur.bmode));
    el.querySelector('#psv').disabled=!dirty()||!cur.username.trim()};
  const pickBadge=()=>{const d=sheet(`<h2>Бейдж</h2>${bl.length?`<div class="bgrid">${bl.map(b=>`<button class="bpk${b.id===cur.badge?' on':''}" data-bid="${b.id}">${bimg(b)}<small>${esc(b.title)}</small></button>`).join('')}</div>`:'<div class="empty" style="padding:6px 0 12px">У вас пока нет бейджей</div>'}${cur.badge?'<button class="btn dng" data-bid="">Убрать бейдж</button>':''}`);
    d.onclick=e=>{const b=e.target.closest('[data-bid]');if(!b)return;cur.badge=b.dataset.bid||null;d.close();paint()}};
  const pickBanner=()=>pickFile(f=>cropImage(f,b=>{bf=b;brm=false;if(bnu)URL.revokeObjectURL(bnu);bnu=URL.createObjectURL(b);paint()},false,{ar:3,title:'Область баннера',w:1000}));
  el.addEventListener('input',e=>{if(e.target.id==='pnm')cur.username=e.target.value;if(e.target.id==='pbio')cur.bio=e.target.value;paint()});
  el.addEventListener('click',e=>{const c=e.target.closest('[data-c]'),f=e.target.closest('[data-f]'),bm=e.target.closest('[data-bm]');if(bm){cur.bmode=bm.dataset.bm;paint()}if(c){cur.accent=c.dataset.c;paint()}if(f){cur.frame=f.dataset.f;paint()}if(e.target.closest('#pa'))el.querySelector('#paf').click();if(e.target.closest('[data-bpick]'))pickBadge();const bn=e.target.closest('[data-bn]');if((bn&&bn.dataset.bn==='pick')||e.target.closest('[data-banpick]'))pickBanner();if(bn&&bn.dataset.bn==='rm'){brm=true;bf=null;if(bnu){URL.revokeObjectURL(bnu);bnu=null}paint()}});
  el.querySelector('#paf').onchange=e=>{af=e.target.files[0];if(af){if(aurl)URL.revokeObjectURL(aurl);aurl=URL.createObjectURL(af);paint()}};
  el.querySelector('#psv').onclick=async e=>{const b=e.currentTarget;b.disabled=true;
    const u={username:cur.username.trim(),bio:cur.bio.trim(),style:{accent:cur.accent,frame:cur.frame,bmode:cur.bmode},pinned_badge_id:cur.badge};
    if(af){const url=await putImage('avatars',af);if(url)u.avatar_url=url;else toast('Фото не загрузилось')}
    if(bf){const bu=await putImage('covers',bf,1000);if(bu)u.banner_url=bu;else toast('Баннер не загрузился')}else if(brm)u.banner_url=null;
    let r=await sb.from('profiles').update(u).eq('id',S.user.id);
    if(r.error&&/banner_url/.test(r.error.message)){const u2={...u};delete u2.banner_url;delete u.banner_url;r=await sb.from('profiles').update(u2).eq('id',S.user.id);
      if(!r.error){toast('Баннер не сохранён: в базе нет колонки banner_url (см. SQL в коде)')}}
    if(r.error){b.disabled=false;return toast(r.error.code==='23505'||/unique/.test(r.error.message)?'Это имя уже занято':'Ошибка: '+r.error.message)}
    ME={...ME,...u};setNavAvatar();el.close();toast('Профиль обновлён');profile()};
  paint();
}
async function showStats(){
  const s=await stats(S.user.id);
  const tiles=[['Просмотры',s.profile_views||0],['Подписчики',s.fr],['Подписки',s.fg],['Треков',s.up],['Лайков',s.lk],['Дней',s.ds],['Ачивок',s.ac]];
  sheet(`<h2>Статистика</h2><div class="sgrid">${tiles.map(t=>`<div class="tile"><b>${t[1]}</b><small>${t[0]}</small></div>`).join('')}</div>`);
}
/* ---------- события ---------- */
let lpT=null,lpFired=false,lpX=0,lpY=0;
document.addEventListener('pointerdown',e=>{lpFired=false;clearTimeout(lpT);const it=e.target.closest('.tr[data-i]');if(!it||e.target.closest('[data-menu]'))return;lpX=e.clientX;lpY=e.clientY;
  lpT=setTimeout(()=>{const g=lget(it.dataset.l,it.dataset.i);if(!g)return;lpFired=true;if(navigator.vibrate)navigator.vibrate(12);openMenu(g.t,it)},480)});
document.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-lpX,e.clientY-lpY)>10)clearTimeout(lpT)});
['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,()=>clearTimeout(lpT)));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.tr'))e.preventDefault()});
document.addEventListener('click',e=>{
  if(lpFired){lpFired=false;return}
  const q=s=>e.target.closest(s);let x;
  if(x=q('[data-go]')){closeAll();return go(x.dataset.go)}
  if(q('[data-soon]'))return soon();
  if(q('[data-bell]'))return openNotifs();
  if(q('[data-ach]'))return openAch();
  if(q('[data-bdg]'))return openBadges();
  if(x=q('[data-sq]')){$('q').value=x.dataset.sq;return $('q').dispatchEvent(new Event('input'))}
  if(x=q('[data-sx]')){setH(getH().filter(v=>v!==x.dataset.sx));return searchHome()}
  if(q('[data-sclr]')){setH([]);return searchHome()}
  if(q('[data-set2]'))return openSettings();
  if(q('[data-orx]'))return S?toast('Привязка скоро'):mxLogin();
  if(q('[data-plus]'))return addTrack();
  if(q('[data-addtrack]'))return addTrack();
  if(q('[data-addpl]'))return addPlaylist();
  if(q('[data-signin]'))return signInGoogle();
  if(q('[data-mail]'))return mailAuth();
  if(q('[data-pe]'))return editProfile();
  if(q('[data-st]'))return showStats();
  if(q('[data-out]'))return confirmOut();
  if(q('[data-retry]'))return go(view);
  if(x=q('[data-more]'))return MORE[x.dataset.more]&&MORE[x.dataset.more]();
  if(x=q('[data-back]'))return x.closest('.ov').close();
  const it=q('[data-i]');
  if(it){const g=lget(it.dataset.l,it.dataset.i);if(!g)return;
    if(q('[data-menu]'))return openMenu(g.t,it);
    queue=g.l.slice();return play(+it.dataset.i)}
  if(x=q('[data-p]'))return openPlaylist(x.dataset.p);
  if(x=q('[data-u]'))return openUser(x.dataset.u);
});
window.addEventListener('error',e=>{if(/ResizeObserver/.test(e.message||''))return;try{toast('Ошибка: '+e.message)}catch(x){}});
window.addEventListener('unhandledrejection',e=>{const r=e.reason;if(r&&(r.name==='AbortError'||r.name==='NotAllowedError'))return;try{toast('Ошибка: '+((r&&r.message)||r))}catch(x){}});
async function loadUser(){
  if(userLoading||!S)return;userLoading=true;
  try{
    const [pr,lks]=await Promise.all([sb.from('profiles').select('*').eq('id',S.user.id).single(),sb.from('likes').select('track_id').eq('user_id',S.user.id)]);
    if(pr.data){ME=pr.data;admin=!!ME.is_admin}
    if(lks.data){LIKED.clear();lks.data.forEach(x=>LIKED.add(x.track_id))}
    await loadSettings();initNotifs();
    sb.from('activity_days').upsert({user_id:S.user.id,day:new Date().toISOString().slice(0,10)},{ignoreDuplicates:true}).then(()=>{},()=>{});
  }catch(e){console.error(e)}
  userLoading=false;setNavAvatar();paintHeart();go(view);
}
(async()=>{
  new ResizeObserver(()=>document.documentElement.style.setProperty('--dock-h',$('dock').offsetHeight+'px')).observe($('dock'));
  lk.innerHTML=ic('heart');pp.innerHTML=ic('play','f');nx.innerHTML=ic('skip','f');setNavAvatar();
  sb.auth.onAuthStateChange((ev,sess)=>{
    if(ev==='SIGNED_IN'&&sess&&(!S||S.user.id!==sess.user.id)){S=sess;setTimeout(loadUser,0)}
    else if(ev==='TOKEN_REFRESHED'&&sess)S=sess;
    else if(ev==='SIGNED_OUT'&&S)afterSignOut();
  });
  go('home');
  /* если сессия восстанавливается дольше 8 с — не бросаем её, а догружаем профиль, когда она придёт */
  const sp=sb.auth.getSession().then(r=>r.data.session,()=>null);
  S=await Promise.race([sp,new Promise(r=>setTimeout(()=>r(null),8000))]);
  if(S)await loadUser();else sp.then(ss=>{if(ss&&!S){S=ss;loadUser()}});
  setInterval(async()=>{try{const r=await sb.auth.getSession();if(r.data.session)S=r.data.session;if(S&&await countUnread()&&!document.hidden)toast('Новое уведомление')}catch(e){}},60000);
})();
