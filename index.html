async function shrink(b,max=512){const im=await createImageBitmap(b),k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');

  x.onload=()=>{let m='';try{m=JSON.parse(x.responseText).message}catch(e){}res(x.status<300?{}:{error:{message:m||('HTTP '+x.status)}})};

  m.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY;on=true});
  m.addEventListener('pointerup',e=>{if(!on)return;on=false;const dx=e.clientX-x0,dy=e.clientY-y0;
    if(Math.abs(dx)>50&&Math.abs(dy)<40){const f=dx<0;m.classList.remove('swl','swr');void m.offsetWidth;m.classList.add(f?'swl':'swr');step(f?1:-1)}});
  m.addEventListener('pointercancel',()=>{on=false})})();
/* ---------- уведомления ---------- */
const ago=t=>{const m=Math.floor((Date.now()-new Date(t))/60000);if(m<1)return 'только что';if(m<60)return m+' мин назад';const h=Math.floor(m/60);if(h<24)return h+' ч назад';const d=Math.floor(h/24);if(d<7)return d+' дн назад';return new Date(t).toLocaleDateString('ru-RU',{day:'numeric',month:'long'})};
const bdg=()=>UNREAD>0?`<i class="bd">${UNREAD>9?'9+':UNREAD}</i>`:'';
function paintBell(){document.querySelectorAll('[data-bell]').forEach(b=>{const o=b.querySelector('.bd');if(o)o.remove();b.insertAdjacentHTML('beforeend',bdg())})}
const allowed=()=>['badge','achievement',...(SET.n_follow?['follow']:[]),...(SET.n_top?['top_track']:[])];
async function countUnread(){const r=await sb.from('notifications').select('*',{count:'exact',head:true}).eq('user_id',S.user.id).is('read_at',null).in('type',allowed());UNREAD=r.count||0;paintBell()}
async function initNotifs(){
  await countUnread();
  sb.channel('notif-'+S.user.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+S.user.id},p=>{if(allowed().includes(p.new.type)){UNREAD++;paintBell();toast('Новое уведомление')}}).subscribe();
}
const nrow=x=>{const nw=x.read_at?'':' new';
  if(x.type==='follow')return `<div class="row nr${nw}"${x.actor?` data-u="${x.actor.id}"`:''}>${ava(x.actor||{username:'?'},48)}<div class="t"><b>${esc(x.actor?x.actor.username:'Пользователь')}</b><small>подписался на вас · ${ago(x.created_at)}</small></div></div>`;
  if(x.type==='top_track')return `<div class="row nr${nw}">${cov(x.track&&x.track.artwork_url)}<div class="t"><b>Ваш трек стал №1</b><small>«${esc(x.track?x.track.title:'')}» теперь самый прослушиваемый · ${ago(x.created_at)}</small></div></div>`;
  return `<div class="row nr${nw}"><span class="bsym" style="--bc:${x.type==='badge'?'#4fd6b4':'#fbbf24'}">★</span><div class="t"><b>${x.type==='badge'?'Вам выдан бейдж':'Новая ачивка'}</b><small>«${esc(x.note||'')}» · ${ago(x.created_at)}</small></div></div>`};
async function openNotifs(){
  if(!S){toast('Войдите, чтобы видеть уведомления');return signIn()}
  const {data}=await sb.from('notifications').select('*,actor:profiles!actor_id(id,username,avatar_url),track:tracks(id,title,artwork_url)').eq('user_id',S.user.id).order('created_at',{ascending:false}).limit(50);
  const n=(data||[]).filter(x=>allowed().includes(x.type)),empty='<div class="empty" style="padding:24px 0;text-align:center">Пока нет уведомлений</div>';
  const el=openOv('Уведомления',`<div id="nl">${n.map(nrow).join('')||empty}</div>`,`<button class="ib" id="nclr" aria-label="Очистить">${ic('trash')}</button>`);
  el.querySelector('#nclr').onclick=async()=>{if(!n.length)return;await sb.from('notifications').delete().eq('user_id',S.user.id);el.querySelector('#nl').innerHTML=empty;n.length=0;UNREAD=0;paintBell();toast('Уведомления очищены')};
  if(UNREAD>0){await sb.from('notifications').update({read_at:new Date().toISOString()}).eq('user_id',S.user.id).is('read_at',null);UNREAD=0;paintBell()}
}
function setNavAvatar(){const b=document.querySelector('[data-go=profile]');b.innerHTML=ME?ava(ME,30):ic('user');hydrate(b)}
function addPlaylist(){
  coverFile=null;PICK=new Set();
  const d=sheet(`<h2>Новый плейлист</h2><div class="cpick"><img id="cp" class="cov" src="${BLANK}" alt=""><button class="btn" id="cb">Обложка</button></div><input type="file" id="cf" accept="image/*" hidden>
    <input class="in" id="pn2" placeholder="Название"><select class="in" id="pr"><option value="1">Публичный</option><option value="0">Приватный</option></select>
    <button class="btn" id="pk">Добавить трек</button><button class="btn pri" id="pc">Создать</button>`);
  cb.onclick=()=>cf.click();cf.onchange=e=>{coverFile=e.target.files[0];if(coverFile)cp.src=URL.createObjectURL(coverFile)};
  pk.onclick=async()=>{const {data}=await TQ().order('created_at',{ascending:false}).limit(300),tr=data||[];
    const ov=openOv('Выберите треки',tr.map((t,i)=>`<div class="row pick${PICK.has(t.id)?' sel':''}" data-pick="${i}">${cov(t.artwork_url)}<div class="t"><b>${esc(t.title)}</b><small>${esc(t.artist)}</small></div></div>`).join('')||'<div class="empty">В базе пока нет треков</div>');
    ov.onclick=e=>{const r=e.target.closest('[data-pick]');if(!r)return;const id=tr[+r.dataset.pick].id;PICK.has(id)?PICK.delete(id):PICK.add(id);r.classList.toggle('sel')};
    ov.onclose=()=>{pk.textContent='Добавить трек'+(PICK.size?' ('+PICK.size+')':'')}};
  pc.onclick=async()=>{const ti=pn2.value.trim();if(!ti)return toast('Введите название');pc.disabled=true;
    const cvr=coverFile?await putImage('covers',coverFile):null;
    const {data,error}=await sb.from('playlists').insert({owner_id:S.user.id,title:ti,cover_url:cvr,is_public:pr.value==='1'}).select('id').single();
    if(error){pc.disabled=false;return toast('Ошибка: '+error.message)}
    if(PICK.size)await sb.from('playlist_tracks').insert([...PICK].map((t,i)=>({playlist_id:data.id,track_id:t,position:i})));
    d.close();toast('Плейлист создан');go(view)};
}
async function openPlaylist(id){
  const [p,t,lk]=await Promise.all([sb.from('playlists').select('*').eq('id',id).single(),sb.from('playlist_tracks').select('position,tracks(*)').eq('playlist_id',id).order('position'),
    S?sb.from('playlist_likes').select('*').match({user_id:S.user.id,playlist_id:id}):{data:[]}]);
  const tr=(t.data||[]).map(x=>x.tracks).filter(Boolean);let on=(lk.data||[]).length>0;
  const el=openOv(p.data?p.data.title:'Плейлист',lst(tr,trow)||'<div class="empty">В плейлисте пока нет треков</div>',`<button class="ib" id="plk" style="color:var(--accent)">${on?'♥':'♡'}</button>`);
  el.querySelector('#plk').onclick=async e=>{if(!S)return signIn();const m={user_id:S.user.id,playlist_id:id};
    on?await sb.from('playlist_likes').delete().match(m):await sb.from('playlist_likes').insert(m);on=!on;e.target.textContent=on?'♥':'♡'};
}
async function openUser(id){
  const [s,t,f]=await Promise.all([stats(id),TQ().eq('uploader_id',id).order('created_at',{ascending:false}),S?sb.from('follows').select('*').match({follower_id:S.user.id,following_id:id}):{data:[]}]);
  let on=(f.data||[]).length>0;const mine=S&&S.user.id===id;
  const el=openOv(s.username,`<div class="pf">${ava(s,80)}<h1>${esc(s.username)}${s.is_admin?'<span class="vf">✓</span>':''}${medalOf(s)}</h1>${badgeChip(s)}<div class="cnt"><div><b>${s.fr}</b><small>подписчиков</small></div><div><b>${s.fg}</b><small>подписок</small></div></div>
    ${mine?'':`<button class="btn pri" id="fw">${on?'Вы подписаны':'Подписаться'}</button>`}</div>${(!mine&&s.priv&&s.priv.hide_uploads)?'<div class="empty" style="padding:18px 0;text-align:center">Пользователь скрыл свои загрузки</div>':lst(t.data||[],trow)}`);
  const b=el.querySelector('#fw');if(b)b.onclick=async()=>{if(!S)return signIn();const m={follower_id:S.user.id,following_id:id};
    on?await sb.from('follows').delete().match(m):await sb.from('follows').insert(m);on=!on;b.textContent=on?'Вы подписаны':'Подписаться'};
}
async function editProfile(){
  const s=await stats(S.user.id),st=s.style||{},PAL=['#4fd6b4','#4a7cf0','#a78bfa','#f472b6','#fbbf24'];
  const base={username:s.username,bio:s.bio||'',accent:st.accent||PAL[0],frame:st.frame||'ring'};let cur={...base},af=null,aurl=null;
  const el=openOv('Изменить профиль',`<div id="pvw"></div><button class="mrow" id="pa"><span class="mi-ic">${ic('user')}</span><span>Сменить фото</span>${ic('more')}</button><input type="file" id="paf" accept="image/*" hidden>
    <input class="in" id="pnm" maxlength="24" placeholder="Имя" value="${esc(base.username)}"><textarea class="in" id="pbio" maxlength="80" rows="2" placeholder="О себе">${esc(base.bio)}</textarea>
    <div class="sh3">Цвет профиля</div><div class="pal">${PAL.map(c=>`<button class="swt" data-c="${c}" style="--c:${c}"></button>`).join('')}</div>
    <div class="sh3">Рамка аватара</div><div class="seg"><button data-f="ring">Кольцо</button><button data-f="none">Без рамки</button></div>`,'<button class="ib" id="psv" style="width:auto;padding:0 16px;font-weight:600;color:var(--accent)" disabled>Готово</button>');
  const dirty=()=>cur.username!==base.username||cur.bio!==base.bio||cur.accent!==base.accent||cur.frame!==base.frame||!!af;
  const paint=()=>{el.querySelector('#pvw').innerHTML=profCard({...s,username:cur.username||'Имя',bio:cur.bio,style:{accent:cur.accent,frame:cur.frame},avatar_url:aurl||s.avatar_url});hydrate(el);
    el.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('on',b.dataset.c===cur.accent));el.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('on',b.dataset.f===cur.frame));
    el.querySelector('#psv').disabled=!dirty()||!cur.username.trim()};
  el.addEventListener('input',e=>{if(e.target.id==='pnm')cur.username=e.target.value;if(e.target.id==='pbio')cur.bio=e.target.value;paint()});
  el.addEventListener('click',e=>{const c=e.target.closest('[data-c]'),f=e.target.closest('[data-f]');if(c){cur.accent=c.dataset.c;paint()}if(f){cur.frame=f.dataset.f;paint()}if(e.target.closest('#pa'))el.querySelector('#paf').click()});
  el.querySelector('#paf').onchange=e=>{af=e.target.files[0];if(af){aurl=URL.createObjectURL(af);paint()}};
  el.querySelector('#psv').onclick=async e=>{const b=e.currentTarget;b.disabled=true;
    const u={username:cur.username.trim(),bio:cur.bio.trim(),style:{accent:cur.accent,frame:cur.frame}};
    if(af){const url=await putImage('avatars',af);if(url)u.avatar_url=url}
    const r=await sb.from('profiles').update(u).eq('id',S.user.id);
    if(r.error){b.disabled=false;return toast(r.error.code==='23505'||/unique/.test(r.error.message)?'Это имя уже занято':'Ошибка: '+r.error.message)}
    ME={...ME,...u};setNavAvatar();el.close();toast('Профиль обновлён');profile()};
  paint();
}
async function showStats(){
  const s=await stats(S.user.id);
  const tiles=[['Просмотры',s.profile_views||0],['Подписчики',s.fr],['Подписки',s.fg],['Треков',s.up],['Лайков',s.lk],['Дней',s.ds],['Ачивок',s.ac]];
  sheet(`<h2>Статистика</h2><div class="sgrid">${tiles.map(t=>`<div class="tile"><b>${t[1]}</b><small>${t[0]}</small></div>`).join('')}</div>`);
}
/* ---------- события ---------- */
let lpT=null,lpFired=false,lpX=0,lpY=0;
document.addEventListener('pointerdown',e=>{lpFired=false;clearTimeout(lpT);const it=e.target.closest('.tr[data-i]');if(!it||e.target.closest('[data-menu]'))return;lpX=e.clientX;lpY=e.clientY;
  lpT=setTimeout(()=>{lpFired=true;if(navigator.vibrate)navigator.vibrate(12);openMenu(L[+it.dataset.l][+it.dataset.i],it)},480)});
document.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-lpX,e.clientY-lpY)>10)clearTimeout(lpT)});
['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,()=>clearTimeout(lpT)));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.tr'))e.preventDefault()});
document.addEventListener('click',e=>{
  if(lpFired){lpFired=false;return}
  const q=s=>e.target.closest(s);let x;
  if(x=q('[data-go]'))return go(x.dataset.go);
  if(q('[data-soon]'))return soon();
  if(q('[data-bell]'))return openNotifs();
  if(q('[data-ach]'))return openAch();
  if(q('[data-bdg]'))return openBadges();
  if(x=q('[data-sq]')){$('q').value=x.dataset.sq;return $('q').dispatchEvent(new Event('input'))}
  if(x=q('[data-sx]')){setH(getH().filter(v=>v!==x.dataset.sx));return searchHome()}
  if(q('[data-sclr]')){setH([]);return searchHome()}
  if(q('[data-set2]'))return openSettings();
  if(q('[data-orx]'))return toast('Скоро...');
  if(q('[data-plus]'))return addTrack();
  if(q('[data-addtrack]'))return addTrack();
  if(q('[data-addpl]'))return addPlaylist();
  if(q('[data-signin]'))return signIn();
  if(q('[data-pe]'))return editProfile();
  if(q('[data-st]'))return showStats();
  if(q('[data-out]'))return sb.auth.signOut().then(()=>{S=null;admin=false;ME=null;LIKED.clear();UNREAD=0;sb.removeAllChannels();setNavAvatar();go('home')});
  if(x=q('[data-more]'))return MORE[x.dataset.more]&&MORE[x.dataset.more]();
  if(x=q('[data-back]'))return x.closest('.ov').close();
  const it=q('[data-i]');
  if(it){const t=L[+it.dataset.l][+it.dataset.i];
    if(q('[data-menu]'))return openMenu(t,it);if(q('[data-like]'))return like(t);
    queue=L[+it.dataset.l].slice();return play(+it.dataset.i)}
  if(x=q('[data-p]'))return openPlaylist(x.dataset.p);
  if(x=q('[data-u]'))return openUser(x.dataset.u);
});
(async()=>{
  const {data}=await sb.auth.getSession();S=data.session;
  if(S){
    const [pr,lks]=await Promise.all([sb.from('profiles').select('*').eq('id',S.user.id).single(),sb.from('likes').select('track_id').eq('user_id',S.user.id)]);
    ME=pr.data;admin=!!(ME&&ME.is_admin);(lks.data||[]).forEach(x=>LIKED.add(x.track_id));await loadSettings();initNotifs();
    sb.from('activity_days').upsert({user_id:S.user.id,day:new Date().toISOString().slice(0,10)},{ignoreDuplicates:true}).then(()=>{},()=>{});
  }
  new ResizeObserver(()=>document.documentElement.style.setProperty('--dock-h',$('dock').offsetHeight+'px')).observe($('dock'));
  lk.innerHTML=ic('heart');pp.innerHTML=ic('play','f');nx.innerHTML=ic('skip','f');setNavAvatar();
  go('home');
})();
</script>
</body>
