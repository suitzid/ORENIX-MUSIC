/* ---------- плеер ---------- */
const au=new Audio();
au.onended=()=>step(1);au.onerror=()=>step(1);
au.onplay=()=>{pp.innerHTML=ic('pause','f');vn.classList.add('spin')};au.onpause=()=>{pp.innerHTML=ic('play','f');vn.classList.remove('spin')};
au.ontimeupdate=()=>$('mp').style.setProperty('--pg',(au.currentTime/(au.duration||1)*100)+'%');
pp.onclick=()=>au.paused?au.play():au.pause();nx.onclick=()=>step(1);lk.onclick=()=>queue[qi]&&like(queue[qi]);
function step(d){const n=qi+d;if(n>=0&&n<queue.length)play(n)}
function paintHeart(){lk.classList.toggle('on',!!(queue[qi]&&LIKED.has(queue[qi].id)))}
async function play(i){
  qi=i;const t=queue[i];if(!t||!t.stream_url)return step(1);
  let src=t.stream_url;
  try{const c=await caches.open('orx-audio'),r=await c.match(src);if(r)src=URL.createObjectURL(await r.blob())}catch(e){}
  au.src=src;try{await au.play()}catch(e){}
  $('mp').hidden=false;np.textContent=t.title;na.textContent=t.artist;mpc.dataset.src=t.artwork_url||'';cached(mpc);paintHeart();
  sb.rpc('play_track',{tid:t.id}).then(()=>{},()=>{});
  if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist});
    navigator.mediaSession.setActionHandler('nexttrack',()=>step(1));navigator.mediaSession.setActionHandler('previoustrack',()=>step(-1))}
}
async function like(t){
  if(!S)return signIn();const m={user_id:S.user.id,track_id:t.id};
  if(LIKED.has(t.id)){await sb.from('likes').delete().match(m);LIKED.delete(t.id);toast('Убрано из понравившихся')}
  else{await sb.from('likes').insert(m);LIKED.add(t.id);toast('Добавлено в понравившиеся')}
  paintHeart();
}
async function del(t,el){
  if(!confirm('Удалить «'+t.title+'»?'))return;
  await sb.storage.from('tracks').remove([t.external_id]);
  const r=await sb.from('tracks').delete().eq('id',t.id);
  if(r.error)return toast('Ошибка: '+r.error.message);
  el.remove();toast('Трек удалён');
}

/* ---------- данные ---------- */
const TQ=()=>sb.from('tracks').select('*').eq('source','upload');
async function stats(id){
  const c=(t,col)=>sb.from(t).select('*',{count:'exact',head:true}).eq(col,id);
  const [p,fr,fg,up,lk,ds]=await Promise.all([sb.from('profiles').select('*').eq('id',id).single(),c('follows','following_id'),c('follows','follower_id'),
    sb.from('tracks').select('*',{count:'exact',head:true}).eq('uploader_id',id).eq('source','upload'),c('likes','user_id'),c('activity_days','user_id')]);
  return {...p.data,fr:fr.count||0,fg:fg.count||0,up:up.count||0,lk:lk.count||0,ds:ds.count||0};
}
async function shrink(b,max=512){const im=await createImageBitmap(b),k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.85))}
async function putImage(bucket,blob){const p=S.user.id+'/'+crypto.randomUUID()+'.jpg',r=await sb.storage.from(bucket).upload(p,await shrink(blob),{contentType:'image/jpeg'});
  return r.error?null:sb.storage.from(bucket).getPublicUrl(p).data.publicUrl}

function autofill(f){
  const m=f.name.replace(/\.[^.]+$/,'').split(/\s[-–—]\s/);
  if(m.length>1){ua.value=m[0].trim();ut.value=m.slice(1).join(' - ').trim()}
  if(window.jsmediatags)jsmediatags.read(f,{onSuccess:({tags})=>{
    if(tags.artist)ua.value=tags.artist;if(tags.title)ut.value=tags.title;
    if(tags.picture){coverFile=new Blob([new Uint8Array(tags.picture.data)],{type:tags.picture.format});cp.src=URL.createObjectURL(coverFile)}},onError(){}});
}
function upXhr(path,file,type,onp){return new Promise(res=>{
  const x=new XMLHttpRequest();x.open('POST',SB_URL+'/storage/v1/object/tracks/'+path);
  x.setRequestHeader('Authorization','Bearer '+S.access_token);x.setRequestHeader('apikey',SB_KEY);x.setRequestHeader('Content-Type',type);
  x.upload.onprogress=e=>e.lengthComputable&&onp(e.loaded,e.total);
  x.onload=()=>{let m='';try{m=JSON.parse(x.responseText).message}catch(e){}res(x.status<300?{}:{error:{message:m||('HTTP '+x.status)}})};
  x.onerror=()=>res({error:{message:'нет соединения'}});x.send(file)})}
function addTrack(){
  if(!S)return signIn();coverFile=null;
  const d=sheet(`<h2>Добавить трек</h2><div class="upl"><button class="ib" id="fb">${ic('dir')}</button><div class="pg"><span id="st">Выберите файл (до 7 МБ)</span><div class="bar"><i id="bf"></i></div></div></div>
    <div class="err" id="er"></div><input type="file" id="uf" accept=".m4a,.mp3,audio/*" hidden><input type="file" id="cf" accept="image/*" hidden>
    <div class="cpick"><img id="cp" class="cov" src="${BLANK}" alt=""><button class="btn" id="cb">Обложка</button></div>
    <input class="in" id="ua" placeholder="Исполнитель"><input class="in" id="ut" placeholder="Название"><button class="btn pri" id="ub" disabled>Загрузить</button>`);
  fb.onclick=()=>uf.click();cb.onclick=()=>cf.click();
  const bad=m=>{er.textContent=m;toast(m);uf.value='';st.textContent='Выберите файл (до 7 МБ)';bf.style.width='0';ub.disabled=true};
  uf.onchange=e=>{const f=e.target.files[0];if(!f)return;
    if(f.size>MAX)return bad('Файл слишком большой: '+(f.size/1048576).toFixed(1)+' МБ. Максимум 7 МБ');
    er.textContent='';bf.style.width='0';st.textContent=f.name+' · '+(f.size/1048576).toFixed(1)+' МБ';ub.disabled=false;autofill(f)};
  cf.onchange=e=>{coverFile=e.target.files[0];if(coverFile)cp.src=URL.createObjectURL(coverFile)};
  ub.onclick=async()=>{
    const f=uf.files[0],ti=ut.value.trim(),ar=ua.value.trim()||'—';
    if(!f)return;if(!ti)return toast('Введите название');if(f.size>MAX)return bad('Файл больше 7 МБ');
    ub.disabled=true;er.textContent='';
    const fail=m=>{ub.disabled=false;st.textContent='Не удалось загрузить';er.textContent='Ошибка: '+m;toast('Ошибка загрузки')};
    const ext=/\.mp3$/i.test(f.name)?'mp3':'m4a',path=S.user.id+'/'+crypto.randomUUID()+'.'+ext;
    const u=await upXhr(path,f,ext==='mp3'?'audio/mpeg':'audio/mp4',(l,t)=>{const p=Math.round(l/t*100);bf.style.width=p+'%';st.textContent='Загрузка '+p+'% · '+(l/1048576).toFixed(1)+' из '+(t/1048576).toFixed(1)+' МБ'});
    if(u.error)return fail(u.error.message);
    bf.style.width='100%';st.textContent='Сохраняю...';
    const art=coverFile?await putImage('covers',coverFile):null;
    const dur=await new Promise(r=>{const a=new Audio(URL.createObjectURL(f));a.onloadedmetadata=()=>r(a.duration);a.onerror=()=>r(0)});
    const r=await sb.from('tracks').insert({uploader_id:S.user.id,title:ti,artist:ar,source:'upload',external_id:path,stream_url:sb.storage.from('tracks').getPublicUrl(path).data.publicUrl,artwork_url:art,duration_ms:dur?Math.round(dur*1000):null});
    if(r.error)return fail(r.error.message);
    st.textContent='Готово';setTimeout(()=>{d.close();toast('Трек добавлен');go(view)},500);
  };
}
function playNow(t){queue=[t];play(0)}
function openMenu(t,it){
  const d=sheet(`<div class="mhead">${cov(t.artwork_url)}<div class="t"><b>${esc(t.title)}</b><small>${esc(t.artist)}</small><small>Время: ${dur(t.duration_ms)||'—'}</small></div></div>
    <button class="mi" data-a="next">${ic('next')}Воспроизвести далее</button><button class="mi" data-a="queue">${ic('qadd')}Добавить в очередь</button>
    <button class="mi" data-a="pl">${ic('pladd')}Добавить в плейлист</button><button class="mi" data-a="dl">${ic('dl')}Скачать в кэш</button>
    <button class="mi" data-a="share">${ic('share')}Поделиться</button>${admin?`<button class="mi dng" data-a="del">${ic('trash')}Удалить трек</button>`:''}`,'glass');
  d.onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;d.close();
    if(a==='next'){if(qi<0||!queue.length)playNow(t);else{queue.splice(qi+1,0,t);toast('Сыграет следующим')}}
    if(a==='queue'){if(qi<0||!queue.length)playNow(t);else{queue.push(t);toast('Добавлено в очередь')}}
    if(a==='pl')pickPlaylist(t);
    if(a==='dl'){toast('Скачиваю...');try{await (await caches.open('orx-audio')).add(t.stream_url);toast('Трек сохранён в кэш')}catch(x){toast('Не удалось скачать')}}
    if(a==='share'){if(navigator.share)navigator.share({title:t.title,text:t.title+' — '+t.artist,url:t.stream_url}).catch(()=>{});else{navigator.clipboard.writeText(t.stream_url);toast('Ссылка скопирована')}}
    if(a==='del')del(t,it);
  };
}
async function pickPlaylist(t){
  if(!S)return signIn();
  const {data}=await sb.from('playlists').select('id,title,cover_url').eq('owner_id',S.user.id);
  const d=sheet(`<h2>В плейлист</h2>${(data||[]).map(p=>`<div class="row" data-pid="${p.id}">${cov(p.cover_url)}<div class="t"><b>${esc(p.title)}</b></div></div>`).join('')||'<div class="empty" style="padding:0">Сначала создайте плейлист в Медиатеке</div>'}`);
  d.onclick=async e=>{const r=e.target.closest('[data-pid]');if(!r)return;
    const {count}=await sb.from('playlist_tracks').select('*',{count:'exact',head:true}).eq('playlist_id',r.dataset.pid);
    const x=await sb.from('playlist_tracks').insert({playlist_id:r.dataset.pid,track_id:t.id,position:count||0});
    d.close();toast(x.error?(x.error.code==='23505'?'Уже в плейлисте':'Ошибка'):'Добавлено в плейлист')};
}
function renameSheet(el){
  const d=sheet(`<h2>Имя</h2><input class="in" id="nm2" value="${esc(ME.username)}" maxlength="24"><button class="btn pri" id="sv2">Сохранить</button>`);
  sv2.onclick=async()=>{const v=nm2.value.trim();if(!v)return toast('Введите имя');
    const r=await sb.from('profiles').update({username:v}).eq('id',S.user.id);
    if(r.error)return toast(r.error.code==='23505'||/unique/.test(r.error.message)?'Это имя уже занято':'Ошибка: '+r.error.message);
    ME={...ME,username:v};const sn=el.querySelector('#sn');if(sn)sn.textContent=v;d.close();toast('Имя изменено')};
}
function openSettings(){
  if(!S)return signIn();
  const el=openOv('Настройки профиля',`<button class="mrow" data-s="ava"><span class="mi-ic" id="sa">${ava(ME||{username:'?'},36)}</span><span>Аватар</span>${ic('more')}</button>
    <button class="mrow" data-s="name"><span class="mi-ic">${ic('user')}</span><span>Имя<small style="display:block" id="sn">${esc(ME&&ME.username||'')}</small></span>${ic('more')}</button>
    <button class="mrow" data-soon><span class="mi-ic">${ic('badge')}</span><span>Баннер</span><span class="tag">Скоро</span></button>
    <button class="mrow" data-soon><span class="mi-ic">${ic('award')}</span><span>Достижения</span><span class="tag">Скоро</span></button>
    <div class="ft">orenix music by <a href="https://t.me/orenixpro" target="_blank" rel="noopener">@orenixpro</a> ${VERSION}</div><input type="file" id="sf" accept="image/*" hidden>`);
  el.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;if(b.dataset.s==='ava')el.querySelector('#sf').click();if(b.dataset.s==='name')renameSheet(el)});
  el.querySelector('#sf').onchange=async e=>{const f=e.target.files[0];if(!f)return;toast('Загружаю...');
    const u=await putImage('avatars',f);if(!u)return toast('Не удалось загрузить');
    const r=await sb.from('profiles').update({avatar_url:u}).eq('id',S.user.id);if(r.error)return toast('Ошибка: '+r.error.message);
    ME={...ME,avatar_url:u};setNavAvatar();el.querySelector('#sa').innerHTML=ava(ME,36);hydrate(el);toast('Аватар обновлён')};
}
(function(){const m=$('mp');let x0=0,y0=0,on=false;
  m.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY;on=true});
  m.addEventListener('pointerup',e=>{if(!on)return;on=false;const dx=e.clientX-x0,dy=e.clientY-y0;
    if(Math.abs(dx)>50&&Math.abs(dy)<40){const f=dx<0;m.classList.remove('swl','swr');void m.offsetWidth;m.classList.add(f?'swl':'swr');step(f?1:-1)}});
  m.addEventListener('pointercancel',()=>{on=false})})();
/* ---------- уведомления ---------- */
const ago=t=>{const m=Math.floor((Date.now()-new Date(t))/60000);if(m<1)return 'только что';if(m<60)return m+' мин назад';const h=Math.floor(m/60);if(h<24)return h+' ч назад';const d=Math.floor(h/24);if(d<7)return d+' дн назад';return new Date(t).toLocaleDateString('ru-RU',{day:'numeric',month:'long'})};
const bdg=()=>UNREAD>0?`<i class="bd">${UNREAD>9?'9+':UNREAD}</i>`:'';
function paintBell(){document.querySelectorAll('[data-bell]').forEach(b=>{const o=b.querySelector('.bd');if(o)o.remove();b.insertAdjacentHTML('beforeend',bdg())})}
async function initNotifs(){
  const r=await sb.from('notifications').select('*',{count:'exact',head:true}).eq('user_id',S.user.id).is('read_at',null);
  UNREAD=r.count||0;paintBell();
  sb.channel('notif-'+S.user.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+S.user.id},()=>{UNREAD++;paintBell();toast('Новое уведомление')}).subscribe();
}
const nrow=x=>x.type==='follow'
  ?`<div class="row nr${x.read_at?'':' new'}"${x.actor?` data-u="${x.actor.id}"`:''}>${ava(x.actor||{username:'?'},48)}<div class="t"><b>${esc(x.actor?x.actor.username:'Пользователь')}</b><small>подписался на вас · ${ago(x.created_at)}</small></div></div>`
  :`<div class="row nr${x.read_at?'':' new'}">${cov(x.track&&x.track.artwork_url)}<div class="t"><b>Ваш трек стал №1</b><small>«${esc(x.track?x.track.title:'')}» теперь самый прослушиваемый · ${ago(x.created_at)}</small></div></div>`;
async function openNotifs(){
  if(!S){toast('Войдите, чтобы видеть уведомления');return signIn()}
  const {data}=await sb.from('notifications').select('*,actor:profiles!actor_id(id,username,avatar_url),track:tracks(id,title,artwork_url)').eq('user_id',S.user.id).order('created_at',{ascending:false}).limit(50);
  const n=data||[],empty='<div class="empty" style="padding:24px 0;text-align:center">Пока нет уведомлений</div>';
  const el=openOv('Уведомления',`<div id="nl">${n.map(nrow).join('')||empty}</div>`,`<button class="ib" id="nclr" aria-label="Очистить">${ic('trash')}</button>`);
  el.querySelector('#nclr').onclick=async()=>{if(!n.length)return;await sb.from('notifications').delete().eq('user_id',S.user.id);el.querySelector('#nl').innerHTML=empty;n.length=0;UNREAD=0;paintBell();toast('Уведомления очищены')};
  if(UNREAD>0){await sb.from('notifications').update({read_at:new Date().toISOString()}).eq('user_id',S.user.id).is('read_at',null);UNREAD=0;paintBell()}
}
function setNavAvatar(){const b=document.querySelector('[data-go=profile]');b.innerHTML=ME?ava(ME,30):ic('user');hydrate(b)}
function addPlaylist(){
  coverFile=null;PICK=new Set();
  const d=sheet(`<h2>Новый плейлист</h2><div class="cpick"><img id="cp" class="cov" src="${BLANK}" alt=""><button class="btn" id="cb">Обложка</button></div><input type="file" id="cf" accept="image/*" hidden>
    <input class="in" id="pn2" placeholder="Название"><select class="in" id="pr"><option value="1">Публичный</option><option value="0">Приватный</option></select>
    <button class="btn" id="pk">Добавить трек</button><button class="btn pri" id="pc">Создать</button>`);
  cb.onclick=()=>cf.click();cf.onchange=e=>{coverFile=e.target.files[0];if(coverFile)cp.src=URL.createObjectURL(coverFile)};
  pk.onclick=async()=>{const {data}=await TQ().order('created_at',{ascending:false}).limit(300),tr=data||[];
    const ov=openOv('Выберите треки',tr.map((t,i)=>`<div class="row pick${PICK.has(t.id)?' sel':''}" data-pick="${i}">${cov(t.artwork_url)}<div class="t"><b>${esc(t.title)}</b><small>${esc(t.artist)}</small></div></div>`).join('')||'<div class="empty">В базе пока нет треков</div>');
    ov.onclick=e=>{const r=e.target.closest('[data-pick]');if(!r)return;const id=tr[+r.dataset.pick].id;PICK.has(id)?PICK.delete(id):PICK.add(id);r.classList.toggle('sel')};
    ov.onclose=()=>{pk.textContent='Добавить трек'+(PICK.size?' ('+PICK.size+')':'')}};
  pc.onclick=async()=>{const ti=pn2.value.trim();if(!ti)return toast('Введите название');pc.disabled=true;
    const cvr=coverFile?await putImage('covers',coverFile):null;
    const {data,error}=await sb.from('playlists').insert({owner_id:S.user.id,title:ti,cover_url:cvr,is_public:pr.value==='1'}).select('id').single();
    if(error){pc.disabled=false;return toast('Ошибка: '+error.message)}
    if(PICK.size)await sb.from('playlist_tracks').insert([...PICK].map((t,i)=>({playlist_id:data.id,track_id:t,position:i})));
    d.close();toast('Плейлист создан');go(view)};
}
async function openPlaylist(id){
  const [p,t,lk]=await Promise.all([sb.from('playlists').select('*').eq('id',id).single(),sb.from('playlist_tracks').select('position,tracks(*)').eq('playlist_id',id).order('position'),
    S?sb.from('playlist_likes').select('*').match({user_id:S.user.id,playlist_id:id}):{data:[]}]);
  const tr=(t.data||[]).map(x=>x.tracks).filter(Boolean);let on=(lk.data||[]).length>0;
  const el=openOv(p.data?p.data.title:'Плейлист',lst(tr,trow)||'<div class="empty">В плейлисте пока нет треков</div>',`<button class="ib" id="plk" style="color:var(--accent)">${on?'♥':'♡'}</button>`);
  el.querySelector('#plk').onclick=async e=>{if(!S)return signIn();const m={user_id:S.user.id,playlist_id:id};
    on?await sb.from('playlist_likes').delete().match(m):await sb.from('playlist_likes').insert(m);on=!on;e.target.textContent=on?'♥':'♡'};
}
async function openUser(id){
  const [s,t,f]=await Promise.all([stats(id),TQ().eq('uploader_id',id).order('created_at',{ascending:false}),S?sb.from('follows').select('*').match({follower_id:S.user.id,following_id:id}):{data:[]}]);
  let on=(f.data||[]).length>0;const mine=S&&S.user.id===id;
  const el=openOv(s.username,`<div class="pf">${ava(s,80)}<h1>${esc(s.username)}${s.is_admin?'<span class="vf">✓</span>':''}</h1><div class="cnt"><div><b>${s.fr}</b><small>подписчиков</small></div><div><b>${s.fg}</b><small>подписок</small></div></div>
    ${mine?'':`<button class="btn pri" id="fw">${on?'Вы подписаны':'Подписаться'}</button>`}</div>${lst(t.data||[],trow)}`);
  const b=el.querySelector('#fw');if(b)b.onclick=async()=>{if(!S)return signIn();const m={follower_id:S.user.id,following_id:id};
    on?await sb.from('follows').delete().match(m):await sb.from('follows').insert(m);on=!on;b.textContent=on?'Вы подписаны':'Подписаться'};
}
function editProfile(){
  coverFile=null;
  sb.from('profiles').select('*').eq('id',S.user.id).single().then(({data:p})=>{
    const d=sheet(`<h2>Изменить профиль</h2><div class="cpick"><div id="ap">${ava(p,72)}</div><button class="btn" id="ab">Сменить фото</button></div><input type="file" id="af" accept="image/*" hidden>
      <input class="in" id="nm" placeholder="Имя" value="${esc(p.username)}"><button class="btn pri" id="sv">Сохранить</button>`);
    ab.onclick=()=>af.click();af.onchange=e=>{coverFile=e.target.files[0];if(coverFile)ap.innerHTML=`<img class="av" style="width:72px;height:72px" src="${URL.createObjectURL(coverFile)}">`};
    sv.onclick=async()=>{const u={username:nm.value.trim()};if(!u.username)return toast('Введите имя');sv.disabled=true;
      if(coverFile)u.avatar_url=await putImage('avatars',coverFile);
      const r=await sb.from('profiles').update(u).eq('id',S.user.id);
      if(r.error){sv.disabled=false;return toast(r.error.message.includes('unique')?'Это имя уже занято':'Ошибка: '+r.error.message)}
      ME={...ME,...u};setNavAvatar();d.close();toast('Сохранено');profile()};
  });
}
async function showStats(){
  const s=await stats(S.user.id),nx=AWARDS.find(a=>s.ds<a[0]);
  const tiles=[['Просмотры',s.profile_views||0],['Подписчики',s.fr],['Подписки',s.fg],['Треков',s.up],['Лайков',s.lk],['Дней',s.ds]];
  sheet(`<h2>Статистика</h2><div class="sgrid">${tiles.map(t=>`<div class="tile"><b>${t[1]}</b><small>${t[0]}</small></div>`).join('')}</div>
    <div class="sh3">Награды за дни в приложении</div><div class="awr">${AWARDS.map(a=>`<span class="chip ${s.ds>=a[0]?'':'off'}">★ ${a[1]}</span>`).join('')}</div>
    ${nx?`<small>До «${nx[1]}»: ${nx[0]-s.ds} дн.</small><div class="bar"><i style="width:${Math.round(s.ds/nx[0]*100)}%"></i></div>`:'<small>Все награды получены</small>'}`);
}

/* ---------- события ---------- */
let lpT=null,lpFired=false,lpX=0,lpY=0;
document.addEventListener('pointerdown',e=>{lpFired=false;clearTimeout(lpT);const it=e.target.closest('.tr[data-i]');if(!it||e.target.closest('[data-menu]'))return;lpX=e.clientX;lpY=e.clientY;
  lpT=setTimeout(()=>{lpFired=true;if(navigator.vibrate)navigator.vibrate(12);openMenu(L[+it.dataset.l][+it.dataset.i],it)},480)});
document.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-lpX,e.clientY-lpY)>10)clearTimeout(lpT)});
['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,()=>clearTimeout(lpT)));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.tr'))e.preventDefault()});
document.addEventListener('click',e=>{
  if(lpFired){lpFired=false;return}
  const q=s=>e.target.closest(s);let x;
  if(x=q('[data-go]'))return go(x.dataset.go);
  if(q('[data-soon]'))return soon();
  if(q('[data-bell]'))return openNotifs();
  if(q('[data-set2]'))return openSettings();
  if(q('[data-orx]'))return toast('Скоро...');
  if(q('[data-plus]'))return addTrack();
  if(q('[data-addtrack]'))return addTrack();
  if(q('[data-addpl]'))return addPlaylist();
  if(q('[data-signin]'))return signIn();
  if(q('[data-pe]'))return editProfile();
  if(q('[data-st]'))return showStats();
  if(q('[data-out]'))return sb.auth.signOut().then(()=>{S=null;admin=false;ME=null;LIKED.clear();UNREAD=0;sb.removeAllChannels();setNavAvatar();go('home')});
  if(x=q('[data-more]'))return MORE[x.dataset.more]&&MORE[x.dataset.more]();
  if(x=q('[data-back]'))return x.closest('.ov').close();
  const it=q('[data-i]');
  if(it){const t=L[+it.dataset.l][+it.dataset.i];
    if(q('[data-menu]'))return openMenu(t,it);if(q('[data-like]'))return like(t);
    queue=L[+it.dataset.l].slice();return play(+it.dataset.i)}
  if(x=q('[data-p]'))return openPlaylist(x.dataset.p);
  if(x=q('[data-u]'))return openUser(x.dataset.u);
});
(async()=>{
  const {data}=await sb.auth.getSession();S=data.session;
  if(S){
    const [pr,lks]=await Promise.all([sb.from('profiles').select('*').eq('id',S.user.id).single(),sb.from('likes').select('track_id').eq('user_id',S.user.id)]);
    ME=pr.data;admin=!!(ME&&ME.is_admin);(lks.data||[]).forEach(x=>LIKED.add(x.track_id));initNotifs();
    sb.from('activity_days').upsert({user_id:S.user.id,day:new Date().toISOString().slice(0,10)},{ignoreDuplicates:true}).then(()=>{},()=>{});
  }
  lk.innerHTML=ic('heart');pp.innerHTML=ic('play','f');nx.innerHTML=ic('tri','f');setNavAvatar();
  go('home');
})();
</script>
