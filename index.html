<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1512">
<title>Orenix Music v0.4.1</title>
<link rel="stylesheet" href="/style.css?v=0.4.1">
</head>
<body>
<div id="tb"></div>
<div id="gi"><img src="/logo.png" alt="Orenix"><span>music</span></div>
<main id="app"></main>

<div id="mp" hidden><div id="pb"><i id="pf"></i></div><img id="mpc" class="cov" alt=""><div class="t"><b id="np"></b><small id="na"></small></div><button class="ib" id="lk">♥</button><button class="ib" id="pp">▶</button><button class="ib" id="pn">▶▶</button></div>

<div class="nav"><div class="nav-island" id="ni"><span class="nav-ind"></span>
  <button class="nav-btn active" data-go="home" aria-label="Главная"><svg class="icon" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
  <button class="nav-btn" data-go="lib" aria-label="Медиатека"><svg class="icon" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
  <button class="nav-btn" data-go="search" aria-label="Поиск"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
  <button class="nav-btn" data-go="profile" aria-label="Профиль"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></button>
</div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>
<script>
const VERSION='v0.4.1';
const sb=window.supabase.createClient('https://pehcelgdqtekkknpqvaa.supabase.co','sb_publishable_0rAsicZ1ZzIC2qO6dJ-saQ_XBmlxVPc');
const $=id=>document.getElementById(id), MAX=7*1024*1024;
const BLANK='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const AWARDS=[[1,'Первый день'],[7,'Неделя'],[30,'Месяц'],[100,'100 дней'],[365,'Год']];
let S=null, admin=false, view='home', L=[], MORE={}, queue=[], qi=-1, coverFile=null, PICK=new Set();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const soon=()=>toast('Скоро');
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---------- иконки, кэш обложек, общие куски ---------- */
const I={set:'<path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',plus:'<path d="M12 5v14M5 12h14"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',more:'<path d="M9 5l7 7-7 7"/>',dir:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'};
const ic=n=>`<svg class="icon" viewBox="0 0 24 24">${I[n]}</svg>`;
const hd=r=>`<div class="hd"><button class="ib" data-soon>${ic('set')}</button>${r?`<button class="ib" data-plus>${ic('plus')}</button>`:`<button class="ib" data-soon>${ic('bell')}</button>`}</div>`;
async function cached(img){const u=img.dataset.src; if(!u){img.src=BLANK;return}
  try{const c=await caches.open('orx-covers');let r=await c.match(u);if(!r){await c.add(u);r=await c.match(u)}img.src=URL.createObjectURL(await r.blob())}catch(e){img.src=u}}
const hydrate=r=>r.querySelectorAll('img[data-src]').forEach(cached);
const cov=(u,c='cov')=>`<img class="${c}" data-src="${esc(u||'')}" src="${BLANK}" alt="">`;
const ava=(p,n=40)=>p.avatar_url?`<img class="av" style="width:${n}px;height:${n}px" data-src="${esc(p.avatar_url)}" src="${BLANK}" alt="">`:`<div class="av" style="width:${n}px;height:${n}px;font-size:${n/2.4}px">${esc((p.username||'?')[0].toUpperCase())}</div>`;
function lst(list,fn){const k=L.push(list)-1;return list.map((x,i)=>fn(x,i,k)).join('')}
const tcard=(t,i,k)=>`<div class="card" data-l="${k}" data-i="${i}">${cov(t.artwork_url)}<button class="act" data-like>♥</button>${admin?'<button class="act del" data-del>✕</button>':''}<b>${esc(t.title)}</b><small>${esc(t.artist)}</small></div>`;
const dur=ms=>ms?String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms/1000)%60).padStart(2,'0'):'';
const trk=(t,i,k,rank)=>`<div class="tr" data-l="${k}" data-i="${i}">${rank?`<span class="rk">${i+1}</span>`:''}${cov(t.artwork_url)}<div class="t"><b>${esc(t.title)}</b><small>${esc(t.artist)}</small></div><span class="du">${dur(t.duration_ms)}</span>${admin?'<button class="x" data-del>✕</button>':''}</div>`;
const trow=(t,i,k)=>trk(t,i,k,0);
const colsTr=(l,rank)=>l.length?`<div class="tc">${lst(l,(t,i,k)=>trk(t,i,k,rank))}</div>`:'<div class="empty">Пока пусто</div>';
const pcard=p=>`<div class="card" data-p="${p.id}">${cov(p.cover_url)}<b>${esc(p.title)}</b><small>плейлист</small></div>`;
const prow=p=>`<div class="row" data-p="${p.id}">${cov(p.cover_url)}<div class="t"><b>${esc(p.title)}</b><small>плейлист</small></div></div>`;
const urow=u=>`<div class="row" data-u="${u.id}">${ava(u,48)}<div class="t"><b>${esc(u.username)}</b><small>${esc(u.bio||'')}</small></div></div>`;
const car=(l,fn)=>l.length?`<div class="hs">${lst(l,fn)}</div>`:'<div class="empty">Пока пусто</div>';
const sec=(t,body,more)=>`<section class="sec"><div class="sh"><h2>${t}</h2>${more?`<button class="ib" data-more="${more}">${ic('more')}</button>`:''}</div>${body}</section>`;
function openOv(title,html,right=''){const el=document.createElement('div');el.className='ov';
  el.innerHTML=`<div class="ovh"><button class="ib" data-back>${ic('back')}</button><h2>${esc(title)}</h2>${right||'<span style="width:38px"></span>'}</div>${html}`;
  el.close=()=>{el.remove();el.onclose&&el.onclose()};document.body.appendChild(el);hydrate(el);return el}
function sheet(html){const sh=document.createElement('div'),d=document.createElement('div');sh.className='shade';d.className='sheet';d.innerHTML=html;
  const close=()=>{sh.remove();d.remove()};sh.onclick=close;d.close=close;document.body.append(sh,d);hydrate(d);return d}
const openList=(t,tr,rank)=>openOv(t,lst(tr,(x,i,k)=>trk(x,i,k,rank))||'<div class="empty">Пока пусто</div>');
const needLogin=()=>{app.innerHTML=hd()+'<div class="pad"><p class="empty" style="padding:0 0 12px">Войдите, чтобы пользоваться этим разделом.</p><button class="btn pri" data-signin>Войти через Google</button></div>'};
const signIn=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin}});

/* ---------- плеер ---------- */
const au=new Audio();
au.ontimeupdate=()=>{pf.style.width=(au.currentTime/(au.duration||1)*100)+'%'};
$('pb').onclick=e=>{const r=$('pb').getBoundingClientRect();au.currentTime=au.duration*(e.clientX-r.left)/r.width};
au.onended=()=>step(1);au.onerror=()=>step(1);
au.onplay=()=>pp.textContent='⏸';au.onpause=()=>pp.textContent='▶';
pp.onclick=()=>au.paused?au.play():au.pause();pn.onclick=()=>step(1);lk.onclick=()=>queue[qi]&&like(queue[qi]);
function step(d){const n=qi+d;if(n>=0&&n<queue.length)play(n)}
async function play(i){
  qi=i;const t=queue[i];if(!t||!t.stream_url)return step(1);
  au.src=t.stream_url;try{await au.play()}catch(e){}
  $('mp').hidden=false;np.textContent=t.title;na.textContent=t.artist;mpc.dataset.src=t.artwork_url||'';cached(mpc);
  sb.rpc('play_track',{tid:t.id}).then(()=>{},()=>{});
  if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist});
    navigator.mediaSession.setActionHandler('nexttrack',()=>step(1));navigator.mediaSession.setActionHandler('previoustrack',()=>step(-1))}
}
async function like(t){
  if(!S)return signIn();
  const m={user_id:S.user.id,track_id:t.id},{data}=await sb.from('likes').select('track_id').match(m);
  if(data&&data.length){await sb.from('likes').delete().match(m);toast('Убрано из понравившихся')}
  else{await sb.from('likes').insert(m);toast('Добавлено в понравившиеся')}
}
async function del(t,el){
  if(!confirm('Удалить «'+t.title+'»?'))return;
  await sb.storage.from('tracks').remove([t.external_id]);
  const r=await sb.from('tracks').delete().eq('id',t.id);
  if(r.error)return toast('Ошибка: '+r.error.message);
  el.remove();toast('Трек удалён');
}

/* ---------- данные ---------- */
const TQ=()=>sb.from('tracks').select('*').eq('source','upload');
async function stats(id){
  const c=(t,col)=>sb.from(t).select('*',{count:'exact',head:true}).eq(col,id);
  const [p,fr,fg,up,lk,ds]=await Promise.all([sb.from('profiles').select('*').eq('id',id).single(),c('follows','following_id'),c('follows','follower_id'),
    sb.from('tracks').select('*',{count:'exact',head:true}).eq('uploader_id',id).eq('source','upload'),c('likes','user_id'),c('activity_days','user_id')]);
  return {...p.data,fr:fr.count||0,fg:fg.count||0,up:up.count||0,lk:lk.count||0,ds:ds.count||0};
}
async function shrink(b,max=512){const im=await createImageBitmap(b),k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.85))}
async function putImage(bucket,blob){const p=S.user.id+'/'+crypto.randomUUID()+'.jpg',r=await sb.storage.from(bucket).upload(p,await shrink(blob),{contentType:'image/jpeg'});
  return r.error?null:sb.storage.from(bucket).getPublicUrl(p).data.publicUrl}

/* ---------- экраны ---------- */
async function home(){
  app.innerHTML=hd()+'<div class="empty">Загрузка...</div>';
  const [top,pl,nw]=await Promise.all([TQ().order('plays',{ascending:false}).limit(100),sb.from('popular_playlists').select('*').limit(10),TQ().order('created_at',{ascending:false}).limit(11)]);
  L=[];const T=top.data||[];MORE.top=()=>openList('Топ 100 треков',T,1);
  app.innerHTML=hd()+sec('Популярные треки',colsTr(T.slice(0,11),1),'top')+sec('Популярные плейлисты',car(pl.data||[],pcard))+sec('Новые загрузки',colsTr(nw.data||[]));
  hydrate(app);
}
async function lib(){
  if(!S)return needLogin();const uid=S.user.id;
  app.innerHTML=hd(1)+'<div class="empty">Загрузка...</div>';
  const [lk,own,lpl,mine]=await Promise.all([sb.from('likes').select('created_at,tracks(*)').eq('user_id',uid).order('created_at',{ascending:false}),
    sb.from('playlists').select('*').eq('owner_id',uid),sb.from('playlist_likes').select('playlists(*)').eq('user_id',uid),TQ().eq('uploader_id',uid).order('created_at',{ascending:false})]);
  const liked=(lk.data||[]).map(x=>x.tracks).filter(Boolean),mm=mine.data||[],pm=new Map();
  [...(own.data||[]),...(lpl.data||[]).map(x=>x.playlists).filter(Boolean)].forEach(p=>pm.set(p.id,p));const pls=[...pm.values()];
  L=[];MORE.liked=()=>openList('Понравившиеся треки',liked);MORE.mine=()=>openList('Загруженные мной',mm);
  MORE.pls=()=>openOv('Плейлисты',pls.map(prow).join('')||'<div class="empty">Пока пусто</div>');
  app.innerHTML=hd(1)+sec('Понравившиеся треки',colsTr(liked.slice(0,11)),'liked')+sec('Плейлисты',car(pls.slice(0,10),pcard),pls.length>10?'pls':'')+sec('Загруженные',colsTr(mm.slice(0,11)),'mine');
  hydrate(app);
}
function search(){
  app.innerHTML=hd()+'<div class="pad"><input class="in" id="q" placeholder="Треки, плейлисты, пользователи"><div id="res"></div></div>';
  let tm;$('q').oninput=()=>{clearTimeout(tm);tm=setTimeout(async()=>{
    const s=$('q').value.trim().replace(/[,()%*]/g,' ').trim();if(!s){res.innerHTML='';return}
    const [t,p,u]=await Promise.all([TQ().or(`title.ilike.%${s}%,artist.ilike.%${s}%`).limit(20),sb.from('playlists').select('*').eq('is_public',true).ilike('title','%'+s+'%').limit(10),sb.from('profiles').select('id,username,bio,avatar_url').ilike('username','%'+s+'%').limit(10)]);
    L=[];const e='<div class="empty" style="padding:0">Ничего нет</div>';
    res.innerHTML=`<h2>Треки</h2>${lst(t.data||[],trow)||e}<h2>Плейлисты</h2>${(p.data||[]).map(prow).join('')||e}<h2>Пользователи</h2>${(u.data||[]).map(urow).join('')||e}`;hydrate(res)},350)};
}
async function profile(){
  if(!S)return needLogin();app.innerHTML=hd()+'<div class="empty">Загрузка...</div>';
  const s=await stats(S.user.id),aw=AWARDS.filter(a=>s.ds>=a[0]).pop();
  app.innerHTML=hd()+`<div class="pf">${ava(s,96)}<h1>${esc(s.username)}${s.is_admin?'<span class="vf">✓</span>':''}</h1>
    <div class="cnt"><div><b>${s.fr}</b><small>подписчиков</small></div><div><b>${s.fg}</b><small>подписок</small></div></div>
    <span class="chip">★ ${aw?aw[1]:'Пока нет достижений'}</span></div>
    <div class="pad" style="margin-top:18px"><button class="btn" data-pe>Изменить профиль</button><button class="btn" data-st>Статистика</button>
    <button class="btn" data-soon>Достижения</button><button class="btn" data-soon>Бейджи</button><button class="btn" data-soon>Настройки</button><button class="btn dng" data-out>Выйти</button></div>`;
  hydrate(app);
}
const go=n=>{view=n;document.querySelectorAll('.nav-btn').forEach((b,i)=>{const a=b.dataset.go===n;b.classList.toggle('active',a);if(a)$('ni').style.setProperty('--i',i)});scrollTo(0,0);({home,lib,search,profile})[n]()};

/* ---------- шторки и оверлеи ---------- */
function plusMenu(){const d=sheet('<button class="btn" data-addtrack>Добавить трек</button><button class="btn" data-addpl>Создать плейлист</button>');d.onclick=()=>d.close()}
function autofill(f){
  const m=f.name.replace(/\.[^.]+$/,'').split(/\s[-–—]\s/);
  if(m.length>1){ua.value=m[0].trim();ut.value=m.slice(1).join(' - ').trim()}
  if(window.jsmediatags)jsmediatags.read(f,{onSuccess:({tags})=>{
    if(tags.artist)ua.value=tags.artist;if(tags.title)ut.value=tags.title;
    if(tags.picture){coverFile=new Blob([new Uint8Array(tags.picture.data)],{type:tags.picture.format});cp.src=URL.createObjectURL(coverFile)}},onError(){}});
}
function addTrack(){
  coverFile=null;
  const d=sheet(`<h2>Добавить трек</h2><div class="upl"><button class="ib" id="fb">${ic('dir')}</button><div class="pg" id="pg"><span id="st">Выберите файл (до 7 МБ)</span><i></i></div></div>
    <input type="file" id="uf" accept=".m4a,.mp3,audio/*" hidden><input type="file" id="cf" accept="image/*" hidden>
    <div class="cpick"><img id="cp" class="cov" src="${BLANK}" alt=""><button class="btn" id="cb">Обложка</button></div>
    <input class="in" id="ua" placeholder="Исполнитель"><input class="in" id="ut" placeholder="Название"><button class="btn pri" id="ub">Загрузить</button>`);
  fb.onclick=()=>uf.click();cb.onclick=()=>cf.click();
  uf.onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>MAX){e.target.value='';st.textContent='Файл больше 7 МБ';return}st.textContent=f.name+' · '+(f.size/1048576).toFixed(1)+' МБ';autofill(f)};
  cf.onchange=e=>{coverFile=e.target.files[0];if(coverFile)cp.src=URL.createObjectURL(coverFile)};
  ub.onclick=async()=>{
    const f=uf.files[0],ti=ut.value.trim(),ar=ua.value.trim()||'—';
    if(!f||!ti)return toast('Выберите файл и введите название');if(f.size>MAX)return toast('Файл больше 7 МБ');
    ub.disabled=true;pg.classList.add('busy');
    const ext=/\.mp3$/i.test(f.name)?'mp3':'m4a',path=S.user.id+'/'+crypto.randomUUID()+'.'+ext;
    const u=await sb.storage.from('tracks').upload(path,f,{contentType:ext==='mp3'?'audio/mpeg':'audio/mp4'});
    const fail=m=>{ub.disabled=false;pg.classList.remove('busy');toast('Ошибка: '+m)};
    if(u.error)return fail(u.error.message);
    const art=coverFile?await putImage('covers',coverFile):null;
    const dur=await new Promise(r=>{const a=new Audio(URL.createObjectURL(f));a.onloadedmetadata=()=>r(a.duration);a.onerror=()=>r(0)});
    const r=await sb.from('tracks').insert({uploader_id:S.user.id,title:ti,artist:ar,source:'upload',external_id:path,stream_url:sb.storage.from('tracks').getPublicUrl(path).data.publicUrl,artwork_url:art,duration_ms:dur?Math.round(dur*1000):null});
    if(r.error)return fail(r.error.message);
    d.close();toast('Трек добавлен');go(view);
  };
}
function addPlaylist(){
  coverFile=null;PICK=new Set();
  const d=sheet(`<h2>Новый плейлист</h2><div class="cpick"><img id="cp" class="cov" src="${BLANK}" alt=""><button class="btn" id="cb">Обложка</button></div><input type="file" id="cf" accept="image/*" hidden>
    <input class="in" id="pn2" placeholder="Название"><select class="in" id="pr"><option value="1">Публичный</option><option value="0">Приватный</option></select>
    <button class="btn" id="pk">Добавить трек</button><button class="btn pri" id="pc">Создать</button>`);
  cb.onclick=()=>cf.click();cf.onchange=e=>{coverFile=e.target.files[0];if(coverFile)cp.src=URL.createObjectURL(coverFile)};
  pk.onclick=async()=>{const {data}=await TQ().order('created_at',{ascending:false}).limit(300),tr=data||[];
    const ov=openOv('Выберите треки',tr.map((t,i)=>`<div class="row pick${PICK.has(t.id)?' sel':''}" data-pick="${i}">${cov(t.artwork_url)}<div class="t"><b>${esc(t.title)}</b><small>${esc(t.artist)}</small></div></div>`).join('')||'<div class="empty">В базе пока нет треков</div>');
    ov.onclick=e=>{const r=e.target.closest('[data-pick]');if(!r)return;const id=tr[+r.dataset.pick].id;PICK.has(id)?PICK.delete(id):PICK.add(id);r.classList.toggle('sel')};
    ov.onclose=()=>{pk.textContent='Добавить трек'+(PICK.size?' ('+PICK.size+')':'')}};
  pc.onclick=async()=>{const ti=pn2.value.trim();if(!ti)return toast('Введите название');pc.disabled=true;
    const cvr=coverFile?await putImage('covers',coverFile):null;
    const {data,error}=await sb.from('playlists').insert({owner_id:S.user.id,title:ti,cover_url:cvr,is_public:pr.value==='1'}).select('id').single();
    if(error){pc.disabled=false;return toast('Ошибка: '+error.message)}
    if(PICK.size)await sb.from('playlist_tracks').insert([...PICK].map((t,i)=>({playlist_id:data.id,track_id:t,position:i})));
    d.close();toast('Плейлист создан');go(view)};
}
async function openPlaylist(id){
  const [p,t,lk]=await Promise.all([sb.from('playlists').select('*').eq('id',id).single(),sb.from('playlist_tracks').select('position,tracks(*)').eq('playlist_id',id).order('position'),
    S?sb.from('playlist_likes').select('*').match({user_id:S.user.id,playlist_id:id}):{data:[]}]);
  const tr=(t.data||[]).map(x=>x.tracks).filter(Boolean);let on=(lk.data||[]).length>0;
  const el=openOv(p.data?p.data.title:'Плейлист',lst(tr,trow)||'<div class="empty">В плейлисте пока нет треков</div>',`<button class="ib" id="plk" style="color:var(--accent)">${on?'♥':'♡'}</button>`);
  el.querySelector('#plk').onclick=async e=>{if(!S)return signIn();const m={user_id:S.user.id,playlist_id:id};
    on?await sb.from('playlist_likes').delete().match(m):await sb.from('playlist_likes').insert(m);on=!on;e.target.textContent=on?'♥':'♡'};
}
async function openUser(id){
  const [s,t,f]=await Promise.all([stats(id),TQ().eq('uploader_id',id).order('created_at',{ascending:false}),S?sb.from('follows').select('*').match({follower_id:S.user.id,following_id:id}):{data:[]}]);
  let on=(f.data||[]).length>0;const mine=S&&S.user.id===id;
  const el=openOv(s.username,`<div class="pf">${ava(s,80)}<h1>${esc(s.username)}${s.is_admin?'<span class="vf">✓</span>':''}</h1><div class="cnt"><div><b>${s.fr}</b><small>подписчиков</small></div><div><b>${s.fg}</b><small>подписок</small></div></div>
    ${mine?'':`<button class="btn pri" id="fw">${on?'Вы подписаны':'Подписаться'}</button>`}</div>${lst(t.data||[],trow)}`);
  const b=el.querySelector('#fw');if(b)b.onclick=async()=>{if(!S)return signIn();const m={follower_id:S.user.id,following_id:id};
    on?await sb.from('follows').delete().match(m):await sb.from('follows').insert(m);on=!on;b.textContent=on?'Вы подписаны':'Подписаться'};
}
function editProfile(){
  coverFile=null;
  sb.from('profiles').select('*').eq('id',S.user.id).single().then(({data:p})=>{
    const d=sheet(`<h2>Изменить профиль</h2><div class="cpick"><div id="ap">${ava(p,72)}</div><button class="btn" id="ab">Сменить фото</button></div><input type="file" id="af" accept="image/*" hidden>
      <input class="in" id="nm" placeholder="Имя" value="${esc(p.username)}"><button class="btn pri" id="sv">Сохранить</button>`);
    ab.onclick=()=>af.click();af.onchange=e=>{coverFile=e.target.files[0];if(coverFile)ap.innerHTML=`<img class="av" style="width:72px;height:72px" src="${URL.createObjectURL(coverFile)}">`};
    sv.onclick=async()=>{const u={username:nm.value.trim()};if(!u.username)return toast('Введите имя');sv.disabled=true;
      if(coverFile)u.avatar_url=await putImage('avatars',coverFile);
      const r=await sb.from('profiles').update(u).eq('id',S.user.id);
      if(r.error){sv.disabled=false;return toast(r.error.message.includes('unique')?'Это имя уже занято':'Ошибка: '+r.error.message)}
      d.close();toast('Сохранено');profile()};
  });
}
async function showStats(){
  const s=await stats(S.user.id);
  sheet(`<h2>Статистика</h2>${[['Просмотров профиля',s.profile_views||0],['Подписчиков',s.fr],['Подписок',s.fg],['Загружено треков',s.up],['Понравившихся',s.lk],['Дней в приложении',s.ds]].map(r=>`<div class="srow"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}
    <div class="srow"><span>Награды</span><b>${AWARDS.filter(a=>s.ds>=a[0]).map(a=>a[1]).join(', ')||'пока нет'}</b></div>`);
}

/* ---------- события ---------- */
document.addEventListener('click',e=>{
  const q=s=>e.target.closest(s);let x;
  if(x=q('[data-go]'))return go(x.dataset.go);
  if(q('[data-soon]'))return soon();
  if(q('[data-plus]'))return plusMenu();
  if(q('[data-addtrack]'))return addTrack();
  if(q('[data-addpl]'))return addPlaylist();
  if(q('[data-signin]'))return signIn();
  if(q('[data-pe]'))return editProfile();
  if(q('[data-st]'))return showStats();
  if(q('[data-out]'))return sb.auth.signOut().then(()=>{S=null;admin=false;go('home')});
  if(x=q('[data-more]'))return MORE[x.dataset.more]&&MORE[x.dataset.more]();
  if(x=q('[data-back]'))return x.closest('.ov').close();
  const it=q('[data-i]');
  if(it){const t=L[+it.dataset.l][+it.dataset.i];
    if(q('[data-like]'))return like(t);if(q('[data-del]'))return del(t,it);
    queue=L[+it.dataset.l].slice();return play(+it.dataset.i)}
  if(x=q('[data-p]'))return openPlaylist(x.dataset.p);
  if(x=q('[data-u]'))return openUser(x.dataset.u);
});
(async()=>{
  const {data}=await sb.auth.getSession();S=data.session;
  if(S){
    const p=await sb.from('profiles').select('is_admin').eq('id',S.user.id).single();admin=!!(p.data&&p.data.is_admin);
    sb.from('activity_days').upsert({user_id:S.user.id,day:new Date().toISOString().slice(0,10)},{ignoreDuplicates:true}).then(()=>{},()=>{});
  }
  go('home');
})();
</script>
</body>
